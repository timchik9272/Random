<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acoustic Walkie-Talkie Chat</title>
    <style>
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #1a1a1a; color: #fff; display: flex; flex-direction: column; height: 100vh; }
        
        /* Экран инициализации */
        #startScreen { position: fixed; top:0; left:0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: flex; justify-content: center; align-items: center; z-index: 100; flex-direction: column; text-align: center; padding: 20px; box-sizing: border-box;}
        #startBtn { padding: 15px 30px; font-size: 18px; background: #0078fe; color: white; border: none; border-radius: 25px; cursor: pointer; font-weight: bold; }
        
        /* Интерфейс чата */
        #header { background: #222; padding: 15px; text-align: center; font-weight: bold; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center;}
        #statusIndicator { width: 12px; height: 12px; background: red; border-radius: 50%; display: inline-block; box-shadow: 0 0 8px red; }
        #statusIndicator.listening { background: #32d74b; box-shadow: 0 0 8px #32d74b; }
        
        #chat { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        
        .msg { max-width: 80%; padding: 10px 15px; border-radius: 18px; font-size: 15px; line-height: 1.4; word-wrap: break-word; position: relative; }
        .msg.self { align-self: flex-end; background: #0078fe; color: #fff; border-bottom-right-radius: 4px; }
        .msg.other { align-self: flex-start; background: #333; color: #fff; border-bottom-left-radius: 4px; }
        .msg canvas { display: block; border-radius: 8px; width: 128px; height: 128px; image-rendering: pixelated; margin-top: 5px; background: #000;}
        .msg .meta { font-size: 10px; opacity: 0.6; text-align: right; margin-top: 4px; }

        #inputArea { background: #222; padding: 10px; display: flex; gap: 10px; border-top: 1px solid #333; }
        #fileBtnLabel { background: #444; padding: 10px 15px; border-radius: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px;}
        #textInput { flex: 1; padding: 10px 15px; border-radius: 20px; border: none; background: #111; color: white; outline: none; }
        #sendBtn { background: #32d74b; color: white; border: none; border-radius: 20px; padding: 0 20px; cursor: pointer; font-weight: bold; }
        #sendBtn:disabled { background: #555; cursor: not-allowed; }
    </style>
</head>
<body>

    <div id="startScreen">
        <h2>Акустический Чат 📻</h2>
        <p>Для приема сообщений требуется доступ к микрофону.</p>
        <button id="startBtn">Войти в эфир</button>
    </div>

    <div id="header">
        <span>Рация-Чат</span>
        <div style="display: flex; align-items: center; gap: 8px; font-size: 12px;">
            <span id="statusText">Микрофон выкл</span>
            <div id="statusIndicator"></div>
        </div>
    </div>

    <div id="chat">
        <div class="msg other">Привет! Напиши сообщение или отправь фото. Я слушаю эфир.</div>
    </div>

    <div id="inputArea">
        <label id="fileBtnLabel">
            📷
            <input type="file" id="imageInput" accept="image/*" style="display: none;">
        </label>
        <input type="text" id="textInput" placeholder="Сообщение...">
        <button id="sendBtn">Отправить</button>
    </div>

    <canvas id="hiddenCanvas" width="32" height="32" style="display:none;"></canvas>

<script>
    // --- НАСТРОЙКИ МОДЕМА ---
    // Частоты
    const FREQ_SYNC_IMG = 1000; // Синхро-сигнал для фото
    const FREQ_SYNC_TXT = 800;  // Синхро-сигнал для текста
    const FREQ_BLACK = 1500;    // Черный цвет
    const FREQ_WHITE = 2500;    // Белый цвет
    const FREQ_BIT_0 = 1400;    // Бит 0
    const FREQ_BIT_1 = 2200;    // Бит 1

    // Тайминги
    const PIXEL_TIME = 0.04; // 40 мс на пиксель (ускорено)
    const BIT_TIME = 0.08;   // 80 мс на бит текста
    const SYNC_TIME = 1.0;   // 1 секунда на сигнал старта
    const IMG_SIZE = 32;     // Размер фото 32x32

    let audioCtx;
    let analyser;
    let isListening = false;

    // --- UI ФУНКЦИИ ---
    function addMessage(text, isSelf, canvasElement = null) {
        const chat = document.getElementById('chat');
        const msgDiv = document.createElement('div');
        msgDiv.className = `msg ${isSelf ? 'self' : 'other'}`;
        
        if (text) {
            const span = document.createElement('span');
            span.innerText = text;
            msgDiv.appendChild(span);
        }
        if (canvasElement) {
            msgDiv.appendChild(canvasElement);
        }
        
        const meta = document.createElement('div');
        meta.className = 'meta';
        meta.innerText = new Date().toLocaleTimeString().slice(0, 5);
        msgDiv.appendChild(meta);
        
        chat.appendChild(msgDiv);
        chat.scrollTop = chat.scrollHeight;
        return msgDiv; // Возвращаем элемент для обновления в реал-тайм
    }

    function setUIState(sending) {
        document.getElementById('sendBtn').disabled = sending;
        document.getElementById('textInput').disabled = sending;
        document.getElementById('fileBtnLabel').style.opacity = sending ? 0.5 : 1;
        document.getElementById('statusText').innerText = sending ? "Передача..." : "Слушаю эфир";
    }

    // --- ИНИЦИАЛИЗАЦИЯ ---
    document.getElementById('startBtn').addEventListener('click', async () => {
        try {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false } });
            
            const microphone = audioCtx.createMediaStreamSource(stream);
            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 2048;
            analyser.smoothingTimeConstant = 0.1;
            microphone.connect(analyser);
            
            isListening = true;
            document.getElementById('startScreen').style.display = 'none';
            document.getElementById('statusIndicator').classList.add('listening');
            document.getElementById('statusText').innerText = "Слушаю эфир";
            
            startListening(); // Запускаем приемник
        } catch (err) {
            alert("Ошибка микрофона! Разрешите доступ. " + err);
        }
    });

    // --- ПЕРЕДАТЧИК (ФОТО) ---
    document.getElementById('imageInput').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        
        const img = new Image();
        const reader = new FileReader();
        reader.onload = (ev) => img.src = ev.target.result;
        img.onload = () => {
            const canvas = document.getElementById('hiddenCanvas');
            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            ctx.drawImage(img, 0, 0, IMG_SIZE, IMG_SIZE);
            
            // ЧБ
            let imgData = ctx.getImageData(0, 0, IMG_SIZE, IMG_SIZE);
            for (let i = 0; i < imgData.data.length; i += 4) {
                let gray = (imgData.data[i] + imgData.data[i+1] + imgData.data[i+2]) / 3;
                imgData.data[i] = imgData.data[i+1] = imgData.data[i+2] = gray;
            }
            
            // Показываем в чате свое отправленное фото
            let displayCanvas = document.createElement('canvas');
            displayCanvas.width = IMG_SIZE; displayCanvas.height = IMG_SIZE;
            displayCanvas.getContext('2d').putImageData(imgData, 0, 0);
            addMessage(null, true, displayCanvas);

            sendPhotoAudio(imgData.data);
            e.target.value = ''; // сброс
        };
        reader.readAsDataURL(file);
    });

    function sendPhotoAudio(imgDataBytes) {
        setUIState(true);
        let osc = audioCtx.createOscillator();
        osc.type = 'sine';
        osc.connect(audioCtx.destination);
        
        let t = audioCtx.currentTime + 0.1;
        
        // Синхронизация (1 секунда 1000 Гц)
        osc.frequency.setValueAtTime(FREQ_SYNC_IMG, t);
        t += SYNC_TIME;

        // Данные пикселей
        for (let i = 0; i < IMG_SIZE * IMG_SIZE; i++) {
            let grayValue = imgDataBytes[i * 4]; 
            let freq = FREQ_BLACK + (grayValue / 255) * (FREQ_WHITE - FREQ_BLACK);
            osc.frequency.setValueAtTime(freq, t);
            t += PIXEL_TIME;
        }

        osc.start(audioCtx.currentTime);
        osc.stop(t);
        
        setTimeout(() => setUIState(false), (t - audioCtx.currentTime) * 1000);
    }

    // --- ПЕРЕДАТЧИК (ТЕКСТ) ---
    document.getElementById('sendBtn').addEventListener('click', () => {
        const input = document.getElementById('textInput');
        const text = input.value.trim();
        if(!text) return;
        
        addMessage(text, true);
        input.value = '';
        setUIState(true);

        // Текст -> Байты (UTF-8 поддерживает русский)
        const bytes = new TextEncoder().encode(text);
        
        let osc = audioCtx.createOscillator();
        osc.type = 'sine';
        osc.connect(audioCtx.destination);
        
        let t = audioCtx.currentTime + 0.1;

        // Синхронизация (800 Гц)
        osc.frequency.setValueAtTime(FREQ_SYNC_TXT, t);
        t += SYNC_TIME;

        // Передача (Старт-бит 0, 8 бит данных, Стоп-бит 1)
        for(let i=0; i<bytes.length; i++) {
            let byte = bytes[i];
            
            // Start bit (0)
            osc.frequency.setValueAtTime(FREQ_BIT_0, t); t += BIT_TIME;
            
            // 8 Data bits (LSB first)
            for(let b=0; b<8; b++) {
                let bit = (byte >> b) & 1;
                osc.frequency.setValueAtTime(bit ? FREQ_BIT_1 : FREQ_BIT_0, t);
                t += BIT_TIME;
            }
            
            // Stop bit (1)
            osc.frequency.setValueAtTime(FREQ_BIT_1, t); t += BIT_TIME;
        }

        osc.start(audioCtx.currentTime);
        osc.stop(t);

        setTimeout(() => setUIState(false), (t - audioCtx.currentTime) * 1000);
    });


    // --- ПРИЕМНИК (DSP И РЕАЛ-ТАЙМ РАСШИФРОВКА) ---
    function getDominantFrequency(dataArray) {
        let maxVal = -Infinity;
        let maxIndex = -1;
        for (let i = 0; i < dataArray.length; i++) {
            if (dataArray[i] > maxVal) {
                maxVal = dataArray[i];
                maxIndex = i;
            }
        }
        if (maxVal < -60) return 0; // Шум
        return maxIndex * (audioCtx.sampleRate / analyser.fftSize);
    }

    function startListening() {
        const bufferLength = analyser.frequencyBinCount;
        const dataArray = new Float32Array(bufferLength);
        
        let state = "IDLE"; 
        // IDLE -> SYNC_WAIT -> RECV_IMG | RECV_TXT
        
        let syncFrames = 0;
        let startTime = 0;
        
        // Для фото
        let activeCanvas = null;
        let activeCtx = null;
        
        // Для текста
        let textBytes = [];
        let currentByte = 0;
        let bitIndex = 0;
        let activeTextMsg = null;
        let activeTextSpan = null;

        function loop() {
            requestAnimationFrame(loop);
            if (!isListening || document.getElementById('sendBtn').disabled) return; // Не слушаем себя, когда отправляем

            analyser.getFloatFrequencyData(dataArray);
            let freq = getDominantFrequency(dataArray);
            let now = audioCtx.currentTime;

            // --- 1. ПОИСК СИНХРОСИГНАЛА ---
            if (state === "IDLE") {
                if (Math.abs(freq - FREQ_SYNC_IMG) < 100) {
                    syncFrames++;
                    if (syncFrames > 15) state = "SYNC_IMG_WAIT";
                } else if (Math.abs(freq - FREQ_SYNC_TXT) < 100) {
                    syncFrames++;
                    if (syncFrames > 15) state = "SYNC_TXT_WAIT";
                } else {
                    syncFrames = 0;
                }
            }
            
            // Ждем окончания гудка фото
            else if (state === "SYNC_IMG_WAIT") {
                if (Math.abs(freq - FREQ_SYNC_IMG) > 150 && freq > 1000) {
                    // Гудок кончился, пошли пиксели!
                    state = "RECV_IMG";
                    startTime = now;
                    activeCanvas = document.createElement('canvas');
                    activeCanvas.width = IMG_SIZE; activeCanvas.height = IMG_SIZE;
                    activeCtx = activeCanvas.getContext('2d');
                    activeCtx.fillStyle = 'black';
                    activeCtx.fillRect(0,0,IMG_SIZE,IMG_SIZE);
                    addMessage(null, false, activeCanvas); // Добавляем пустой холст в чат
                }
            }

            // Ждем окончания гудка текста
            else if (state === "SYNC_TXT_WAIT") {
                 if (Math.abs(freq - FREQ_SYNC_TXT) > 150 && freq > 1000) {
                    state = "RECV_TXT";
                    startTime = now;
                    textBytes = [];
                    bitIndex = -1; // -1 означает ожидание старт-бита
                    
                    let msgDiv = addMessage("✍️ Печатает...", false);
                    activeTextSpan = msgDiv.querySelector('span');
                 }
            }

            // --- 2. ПРИЕМ ФОТО (Абсолютное время) ---
            else if (state === "RECV_IMG") {
                let elapsed = now - startTime;
                let currentPixelIndex = Math.floor(elapsed / PIXEL_TIME);
                let totalPixels = IMG_SIZE * IMG_SIZE;

                if (currentPixelIndex >= totalPixels) {
                    state = "IDLE";
                    syncFrames = 0;
                    return;
                }

                // Перевод частоты в цвет
                let colorVal = 0;
                if (freq >= FREQ_BLACK && freq <= FREQ_WHITE) {
                    colorVal = ((freq - FREQ_BLACK) / (FREQ_WHITE - FREQ_BLACK)) * 255;
                } else if (freq > FREQ_WHITE) { colorVal = 255; }
                
                colorVal = Math.floor(colorVal);
                
                let x = currentPixelIndex % IMG_SIZE;
                let y = Math.floor(currentPixelIndex / IMG_SIZE);
                
                activeCtx.fillStyle = `rgb(${colorVal},${colorVal},${colorVal})`;
                activeCtx.fillRect(x, y, 1, 1);
            }

            // --- 3. ПРИЕМ ТЕКСТА (AFSK UART) ---
            else if (state === "RECV_TXT") {
                let elapsed = now - startTime;
                
                // Проверяем, не оборвалась ли связь (2 секунды тишины)
                if (elapsed > (textBytes.length * 10 * BIT_TIME) + 2.0 || freq < 1000) {
                    if (textBytes.length > 0) {
                        try {
                            activeTextSpan.innerText = new TextDecoder().decode(new Uint8Array(textBytes));
                        } catch(e) {}
                    } else {
                        activeTextSpan.innerText = "❌ Ошибка приема";
                    }
                    state = "IDLE";
                    syncFrames = 0;
                    return;
                }

                let currentAbsoluteBit = Math.floor(elapsed / BIT_TIME);
                
                // Каждые 10 бит = 1 байт (1 старт, 8 дата, 1 стоп)
                let bitPosInFrame = currentAbsoluteBit % 10;
                let byteIndex = Math.floor(currentAbsoluteBit / 10);

                // Если мы перешли на новый бит
                if (byteIndex === textBytes.length) {
                    // Мы внутри собираемого байта
                    if (bitPosInFrame >= 1 && bitPosInFrame <= 8) {
                        // Читаем биты данных (погрешность частоты +-300Гц)
                        let isOne = Math.abs(freq - FREQ_BIT_1) < Math.abs(freq - FREQ_BIT_0);
                        if (isOne) {
                            currentByte |= (1 << (bitPosInFrame - 1));
                        }
                    } else if (bitPosInFrame === 9) {
                        // Стоп бит, байт собран!
                        textBytes.push(currentByte);
                        currentByte = 0;
                        
                        // Пытаемся декодировать на лету то, что уже пришло
                        try {
                            activeTextSpan.innerText = new TextDecoder().decode(new Uint8Array(textBytes)) + "✍️";
                        } catch(e) {} // Игнорируем ошибки неполных UTF-8 символов
                    }
                }
            }
        }
        loop();
    }
</script>
</body>
</html>
