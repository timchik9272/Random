<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acoustic Modem (SSTV & FSK)</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; padding: 20px; max-width: 600px; margin: auto; }
        .panel { background: #222; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #444; }
        input, button { padding: 10px; margin: 5px 0; width: 100%; box-sizing: border-box; background: #333; color: #fff; border: 1px solid #555; }
        button { background: #007bff; cursor: pointer; font-weight: bold; }
        button:hover { background: #0056b3; }
        button:disabled { background: #555; cursor: not-allowed; }
        canvas { background: #000; display: block; margin: 10px auto; width: 256px; height: 256px; image-rendering: pixelated; border: 2px solid #555; }
        .log { background: #000; color: #0f0; padding: 10px; height: 100px; overflow-y: scroll; font-family: monospace; font-size: 12px; }
        .status { text-align: center; color: #aaa; font-size: 14px; margin-top: 5px; }
    </style>
</head>
<body>

    <h2>Акустический модем 📻</h2>

    <div class="panel">
        <h3>Отправка (Передатчик)</h3>
        <input type="text" id="smsInput" placeholder="Введите SMS (латиница)...">
        <button id="sendTextBtn">Передать текст звуком</button>
        <hr style="border-color: #444;">
        <label>Выберите фото (будет сильно сжато до 32x32):</label>
        <input type="file" id="imageInput" accept="image/*">
        <canvas id="txCanvas" width="32" height="32" style="display:none;"></canvas>
        <button id="sendImgBtn">Передать фото звуком</button>
        <div id="txStatus" class="status">Ожидание...</div>
    </div>

    <div class="panel">
        <h3>Прием (Приемник)</h3>
        <button id="listenBtn">Включить прослушивание эфира</button>
        <div id="rxStatus" class="status">Микрофон выключен</div>
        
        <h4>Принятое фото:</h4>
        <canvas id="rxCanvas" width="32" height="32"></canvas>
        
        <h4>Принятый текст / Лог:</h4>
        <div id="rxLog" class="log"></div>
    </div>

<script>
    // Настройки модема
    const AUDIO_FREQ_SYNC = 1000; // Частота синхронизации (начало передачи)
    const FREQ_BLACK = 1500;      // Частота черного пикселя
    const FREQ_WHITE = 2500;      // Частота белого пикселя
    const PIXEL_DURATION = 0.05;  // 50 мс на один пиксель (скорость)
    const IMG_SIZE = 32;          // Сжатие до 32x32 пикселей для скорости
    
    // FSK для текста
    const FSK_0 = 1200;
    const FSK_1 = 2200;
    const BIT_DURATION = 0.1; // 100 мс на бит (10 бит/с - очень надежно)

    let audioCtx;

    // --- ИНИЦИАЛИЗАЦИЯ AUDIO API ---
    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
    }

    // --- ПЕРЕДАТЧИК (ФОТО - SSTV) ---
    document.getElementById('imageInput').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        const img = new Image();
        const reader = new FileReader();
        reader.onload = (e) => img.src = e.target.result;
        img.onload = () => {
            const canvas = document.getElementById('txCanvas');
            const ctx = canvas.getContext('2d');
            // Сильное сжатие (отрисовка в 32x32)
            ctx.drawImage(img, 0, 0, IMG_SIZE, IMG_SIZE);
            // Перевод в ЧБ
            let imgData = ctx.getImageData(0, 0, IMG_SIZE, IMG_SIZE);
            for (let i = 0; i < imgData.data.length; i += 4) {
                let gray = (imgData.data[i] + imgData.data[i+1] + imgData.data[i+2]) / 3;
                imgData.data[i] = imgData.data[i+1] = imgData.data[i+2] = gray;
            }
            ctx.putImageData(imgData, 0, 0);
        };
        reader.readAsDataURL(file);
    });

    document.getElementById('sendImgBtn').addEventListener('click', async () => {
        initAudio();
        const canvas = document.getElementById('txCanvas');
        const ctx = canvas.getContext('2d');
        const imgData = ctx.getImageData(0, 0, IMG_SIZE, IMG_SIZE).data;
        const status = document.getElementById('txStatus');
        const btn = document.getElementById('sendImgBtn');
        
        btn.disabled = true;
        let osc = audioCtx.createOscillator();
        osc.type = 'sine';
        osc.connect(audioCtx.destination);
        
        let startTime = audioCtx.currentTime + 0.1;
        
        // 1. Сигнал синхронизации (1 секунда 1000 Гц, чтобы приемник понял, что началось фото)
        osc.frequency.setValueAtTime(AUDIO_FREQ_SYNC, startTime);
        startTime += 1.0;

        // 2. Кодирование пикселей
        let totalPixels = IMG_SIZE * IMG_SIZE;
        for (let i = 0; i < totalPixels; i++) {
            let grayValue = imgData[i * 4]; // берем R (он равен G и B)
            // Маппинг 0-255 в частоту FREQ_BLACK - FREQ_WHITE
            let freq = FREQ_BLACK + (grayValue / 255) * (FREQ_WHITE - FREQ_BLACK);
            osc.frequency.setValueAtTime(freq, startTime + (i * PIXEL_DURATION));
        }

        osc.start();
        osc.stop(startTime + (totalPixels * PIXEL_DURATION));

        // UI обновление прогресса
        let durationMs = (1.0 + totalPixels * PIXEL_DURATION) * 1000;
        let passed = 0;
        let interval = setInterval(() => {
            passed += 100;
            let percent = Math.min(100, Math.floor((passed / durationMs) * 100));
            status.innerText = `Передача: ${percent}% (поднесите к рации)`;
            if (passed >= durationMs) {
                clearInterval(interval);
                status.innerText = "Передача завершена";
                btn.disabled = false;
            }
        }, 100);
    });


    // --- ПЕРЕДАТЧИК (ТЕКСТ - FSK) ---
    document.getElementById('sendTextBtn').addEventListener('click', () => {
        initAudio();
        let text = document.getElementById('smsInput').value;
        if(!text) return;
        
        let binaryStr = "";
        for(let i=0; i<text.length; i++) {
            let bin = text.charCodeAt(i).toString(2).padStart(8, '0');
            binaryStr += bin;
        }

        let osc = audioCtx.createOscillator();
        osc.connect(audioCtx.destination);
        let startTime = audioCtx.currentTime + 0.1;

        // Синхронизация для текста (чередование 1010)
        let syncBits = "1010101011110000"; 
        let fullData = syncBits + binaryStr;

        for(let i=0; i<fullData.length; i++) {
            let freq = fullData[i] === '1' ? FSK_1 : FSK_0;
            osc.frequency.setValueAtTime(freq, startTime + (i * BIT_DURATION));
        }

        osc.start();
        osc.stop(startTime + (fullData.length * BIT_DURATION));
        document.getElementById('txStatus').innerText = "Текст передан в эфир!";
    });


    // --- ПРИЕМНИК ---
    let isListening = false;
    let analyser, microphone, javascriptNode;
    let rxCanvas = document.getElementById('rxCanvas');
    let rxCtx = rxCanvas.getContext('2d');
    
    function logMsg(msg) {
        let l = document.getElementById('rxLog');
        l.innerHTML += `<div>${msg}</div>`;
        l.scrollTop = l.scrollHeight;
    }

    document.getElementById('listenBtn').addEventListener('click', async () => {
        initAudio();
        if (isListening) return;

        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false } });
            microphone = audioCtx.createMediaStreamSource(stream);
            
            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 2048; // Размер окна для точности определения частоты
            analyser.smoothingTimeConstant = 0.2;
            
            microphone.connect(analyser);
            
            isListening = true;
            document.getElementById('rxStatus').innerText = "Слушаю эфир (рацию)...";
            document.getElementById('listenBtn').disabled = true;
            
            startDecoding();
        } catch (err) {
            alert("Ошибка доступа к микрофону: " + err);
        }
    });

    function getDominantFrequency(dataArray, sampleRate, fftSize) {
        let maxVal = -Infinity;
        let maxIndex = -1;
        // Ищем пик в спектре
        for (let i = 0; i < dataArray.length; i++) {
            if (dataArray[i] > maxVal) {
                maxVal = dataArray[i];
                maxIndex = i;
            }
        }
        // Если сигнал слишком слабый (шум), возвращаем 0
        if (maxVal < -70) return 0; 
        
        return maxIndex * (sampleRate / fftSize);
    }

    function startDecoding() {
        const bufferLength = analyser.frequencyBinCount;
        const dataArray = new Float32Array(bufferLength);
        
        let state = "IDLE";
        let syncFrames = 0;
        
        let pixelX = 0;
        let pixelY = 0;
        let lastSampleTime = 0;

        // Основной цикл анализа звука
        function analyze() {
            if (!isListening) return;
            requestAnimationFrame(analyze);

            analyser.getFloatFrequencyData(dataArray);
            let domFreq = getDominantFrequency(dataArray, audioCtx.sampleRate, analyser.fftSize);

            // 1. Ожидание синхросигнала
            if (state === "IDLE") {
                if (Math.abs(domFreq - AUDIO_FREQ_SYNC) < 150) { // Погрешность +-150 Гц из-за шума
                    syncFrames++;
                    if (syncFrames > 20) { // Если слышим стабильный писк синхронизации
                        state = "RECEIVING_IMG";
                        logMsg("Обнаружен сигнал фото! Начинаю декодирование...");
                        rxCtx.fillStyle = "black";
                        rxCtx.fillRect(0, 0, IMG_SIZE, IMG_SIZE);
                        pixelX = 0;
                        pixelY = 0;
                        lastSampleTime = audioCtx.currentTime;
                    }
                } else {
                    syncFrames = 0;
                }
            } 
            // 2. Прием картинки в реальном времени (попиксельно)
            else if (state === "RECEIVING_IMG") {
                let now = audioCtx.currentTime;
                // Сверяем тайминги (прошло ли время для чтения следующего пикселя)
                if (now - lastSampleTime >= PIXEL_DURATION) {
                    lastSampleTime += PIXEL_DURATION; // Жестко держим темп

                    // Преобразуем частоту обратно в цвет
                    let colorVal = 0;
                    if (domFreq >= FREQ_BLACK && domFreq <= FREQ_WHITE) {
                        colorVal = ((domFreq - FREQ_BLACK) / (FREQ_WHITE - FREQ_BLACK)) * 255;
                    } else if (domFreq > FREQ_WHITE) {
                        colorVal = 255;
                    }

                    // Рисуем полученный пиксель
                    colorVal = Math.floor(colorVal);
                    rxCtx.fillStyle = `rgb(${colorVal},${colorVal},${colorVal})`;
                    rxCtx.fillRect(pixelX, pixelY, 1, 1);

                    pixelX++;
                    if (pixelX >= IMG_SIZE) {
                        pixelX = 0;
                        pixelY++;
                    }

                    if (pixelY >= IMG_SIZE) {
                        state = "IDLE";
                        syncFrames = 0;
                        logMsg("Фотография принята полностью.");
                    }
                }
            }
        }
        analyze();
    }
</script>
</body>
</html>
