<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#05070d">
<title>Тайна Обсерватории</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%; overflow:hidden; background:#000;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none; overscroll-behavior: none;
  }
  canvas { display:block; }

  /* ---------- HUD ---------- */
  #hud { position:fixed; inset:0; pointer-events:none; z-index:10; }

  #objective {
    position:absolute; top: calc(env(safe-area-inset-top, 0px) + 12px); left:50%;
    transform:translateX(-50%);
    padding:8px 16px; border-radius:20px;
    background:rgba(10,14,24,.6);
    border:1px solid rgba(140,190,255,.22);
    color:#bcd6ff; font-size:12px; letter-spacing:.06em;
    text-transform:uppercase; white-space:nowrap;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    transition: opacity .4s;
  }

  #hint {
    position:absolute; bottom: calc(env(safe-area-inset-bottom, 0px) + 92px); left:50%;
    transform:translate(-50%, 14px);
    max-width: 88vw; text-align:center;
    padding:12px 20px; border-radius:14px;
    background:rgba(8,12,20,.82);
    border:1px solid rgba(255,210,120,.28);
    color:#f0e2c0; font-size:14px; line-height:1.45;
    opacity:0; transition: opacity .35s, transform .35s;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 8px 32px rgba(0,0,0,.55);
  }
  #hint.show { opacity:1; transform:translate(-50%, 0); }

  #inv {
    position:absolute; bottom: calc(env(safe-area-inset-bottom, 0px) + 22px); left:50%;
    transform:translateX(-50%);
    display:flex; gap:12px; align-items:center;
    padding:9px 16px; border-radius:18px;
    background:rgba(8,12,20,.55);
    border:1px solid rgba(140,190,255,.15);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    min-height:46px;
  }
  .slot {
    width:26px; height:26px; border-radius:50%;
    border:1.5px solid rgba(255,255,255,.16);
    background:rgba(255,255,255,.04);
    transition: all .35s cubic-bezier(.2,1.4,.5,1);
    position:relative;
  }
  .slot.on { border-color:rgba(255,255,255,.5); box-shadow:0 0 14px currentColor; }
  .slot.on::after {
    content:''; position:absolute; inset:4px; border-radius:50%;
    background:currentColor; box-shadow:0 0 12px currentColor;
  }
  #keyIcon { font-size:20px; opacity:.16; transition: all .35s; filter:grayscale(1); }
  #keyIcon.on { opacity:1; filter:none; text-shadow:0 0 14px #ffd97a; }

  /* ---------- Прицел (VR) ---------- */
  #reticle {
    position:absolute; left:50%; top:50%; width:22px; height:22px;
    margin:-11px 0 0 -11px; border-radius:50%;
    border:2px solid rgba(255,255,255,.45);
    display:none; transition: transform .12s, border-color .12s;
  }
  #reticle.active { transform:scale(1.5); border-color:#ffd97a; box-shadow:0 0 18px #ffd97a; }

  /* ---------- Стартовый экран ---------- */
  #start {
    position:fixed; inset:0; z-index:50;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:28px;
    background: radial-gradient(circle at 50% 40%, #14203a 0%, #05070d 65%, #000 100%);
    color:#e8eefc; transition: opacity .8s;
  }
  #start.hide { opacity:0; pointer-events:none; }
  #start h1 {
    font-size: 26px; letter-spacing:.24em; font-weight:300;
    margin-bottom:6px; color:#dce8ff;
    text-shadow:0 0 28px rgba(120,180,255,.5);
  }
  #start .sub {
    font-size:11px; letter-spacing:.4em; color:#7d92b8;
    text-transform:uppercase; margin-bottom:34px;
  }
  #start p {
    font-size:14px; line-height:1.75; color:#9fb2d0;
    max-width:340px; margin-bottom:34px;
  }
  #startBtn {
    pointer-events:auto;
    padding:16px 52px; font-size:15px; letter-spacing:.22em;
    color:#08111f; background:linear-gradient(180deg,#ffe6a6,#e8b955);
    border:none; border-radius:40px; font-weight:700;
    box-shadow:0 0 40px rgba(255,210,120,.35), 0 8px 24px rgba(0,0,0,.5);
    cursor:pointer; transition: transform .15s, box-shadow .15s;
  }
  #startBtn:active { transform:scale(.95); box-shadow:0 0 24px rgba(255,210,120,.5); }
  #start .hint2 { margin-top:26px; font-size:11px; color:#5f7192; letter-spacing:.08em; }

  /* ---------- Рipple ---------- */
  .ripple {
    position:fixed; width:14px; height:14px; margin:-7px 0 0 -7px;
    border-radius:50%; border:2px solid rgba(255,220,140,.9);
    pointer-events:none; z-index:20;
    animation: rip .55s ease-out forwards;
  }
  @keyframes rip {
    from { transform:scale(.4); opacity:1; }
    to   { transform:scale(3.6); opacity:0; }
  }

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",

<script type="module">
import * as THREE from 'three';
import { VRButton } from 'three/addons/webxr/VRButton.js';

/* ══════════════════════════════════════════════════════════
   УТИЛИТЫ
   ══════════════════════════════════════════════════════════ */
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const rand  = (a,b)=>a+Math.random()*(b-a);
const randI = (a,b)=>Math.floor(rand(a,b+1));
const pick  = a=>a[Math.floor(Math.random()*a.length)];
const DEG   = Math.PI/180;

function makeCanvas(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; return c; }
function texFromCanvas(c,rx=1,ry=1,aniso=4){
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(rx,ry);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = aniso;
  return t;
}

/* ── Процедурные текстуры ───────────────────────────────── */

function woodTexture(base='#5b3a22', dark='#2b1a0b', light='#8a5f38', planks=8, vertical=true){
  const S=512, c=makeCanvas(S,S), ctx=c.getContext('2d');
  ctx.fillStyle=base; ctx.fillRect(0,0,S,S);
  for(let i=0;i<7000;i++){
    const a=Math.random()*0.08;
    ctx.fillStyle = Math.random()<0.5 ? `rgba(0,0,0,${a})` : `rgba(255,225,190,${a*0.7})`;
    const x=Math.random()*S, y=Math.random()*S;
    if(vertical) ctx.fillRect(x, y, 1, 12+Math.random()*90);
    else         ctx.fillRect(x, y, 12+Math.random()*90, 1);
  }
  ctx.lineWidth=4; ctx.strokeStyle=dark;
  for(let i=0;i<=planks;i++){
    const p=i*S/planks;
    ctx.beginPath();
    if(vertical){ ctx.moveTo(p,0); ctx.lineTo(p,S); } else { ctx.moveTo(0,p); ctx.lineTo(S,p); }
    ctx.stroke();
  }
  ctx.lineWidth=2; ctx.strokeStyle='rgba(255,255,255,0.055)';
  for(let i=0;i<=planks;i++){
    const p=i*S/planks+3;
    ctx.beginPath();
    if(vertical){ ctx.moveTo(p,0); ctx.lineTo(p,S); } else { ctx.moveTo(0,p); ctx.lineTo(S,p); }
    ctx.stroke();
  }
  return texFromCanvas(c);
}

function stoneTexture(){
  const S=512, c=makeCanvas(S,S), ctx=c.getContext('2d');
  ctx.fillStyle='#17171d'; ctx.fillRect(0,0,S,S);
  const rows=7, cols=5, bh=S/rows, bw=S/cols;
  for(let r=0;r<rows;r++){
    for(let i=-1;i<=cols;i++){
      const x=i*bw+(r%2?bw*0.5:0), y=r*bh;
      const g=46+Math.random()*22;
      ctx.fillStyle=`rgb(${g|0},${g|0},${(g+11)|0})`;
      ctx.fillRect(x+2,y+2,bw-4,bh-4);
      ctx.fillStyle='rgba(255,255,255,0.05)';
      ctx.fillRect(x+2,y+2,bw-4,2);
      ctx.fillStyle='rgba(0,0,0,0.3)';
      ctx.fillRect(x+2,y+bh-4,bw-4,2);
    }
  }
  for(let i=0;i<16000;i++){
    ctx.fillStyle=`rgba(0,0,0,${Math.random()*0.2})`;
    ctx.fillRect(Math.random()*S,Math.random()*S,2,2);
  }
  return texFromCanvas(c,3,1.5);
}

function rugTexture(){
  const S=512, c=makeCanvas(S,S), ctx=c.getContext('2d');
  ctx.fillStyle='#57202c'; ctx.fillRect(0,0,S,S);
  for(let i=0;i<4000;i++){
    ctx.fillStyle=`rgba(0,0,0,${Math.random()*0.12})`;
    ctx.fillRect(Math.random()*S,Math.random()*S,3,3);
  }
  ctx.strokeStyle='#c9a24a'; ctx.lineWidth=7;
  ctx.beginPath(); ctx.arc(S/2,S/2,S/2-30,0,6.28); ctx.stroke();
  ctx.lineWidth=3;
  ctx.beginPath(); ctx.arc(S/2,S/2,S/2-62,0,6.28); ctx.stroke();
  for(let i=0;i<16;i++){
    const a=i/16*Math.PI*2;
    ctx.save(); ctx.translate(S/2,S/2); ctx.rotate(a);
    ctx.fillStyle='#c9a24a';
    ctx.beginPath(); ctx.moveTo(0,-100); ctx.lineTo(20,-150); ctx.lineTo(-20,-150); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.arc(0,-160,7,0,6.28); ctx.fill();
    ctx.restore();
  }
  ctx.fillStyle='#20395c'; ctx.beginPath(); ctx.arc(S/2,S/2,72,0,6.28); ctx.fill();
  ctx.strokeStyle='#c9a24a'; ctx.lineWidth=6; ctx.beginPath(); ctx.arc(S/2,S/2,72,0,6.28); ctx.stroke();
  ctx.fillStyle='#c9a24a';
  for(let i=0;i<8;i++){
    const a=i/8*Math.PI*2;
    ctx.beginPath();
    ctx.moveTo(S/2+Math.cos(a)*16, S/2+Math.sin(a)*16);
    ctx.lineTo(S/2+Math.cos(a+0.4)*46, S/2+Math.sin(a+0.4)*46);
    ctx.lineTo(S/2+Math.cos(a-0.4)*46, S/2+Math.sin(a-0.4)*46);
    ctx.closePath(); ctx.fill();
  }
  return texFromCanvas(c);
}

function starfieldTexture(){
  const S=256, c=makeCanvas(S,S), ctx=c.getContext('2d');
  const g=ctx.createRadialGradient(S*0.6,S*0.35,10,S*0.6,S*0.35,S*0.95);
  g.addColorStop(0,'#1a2f57'); g.addColorStop(0.5,'#0a1228'); g.addColorStop(1,'#02040a');
  ctx.fillStyle=g; ctx.fillRect(0,0,S,S);
  for(let i=0;i<400;i++){
    const r=Math.random()*1.4+0.25;
    ctx.fillStyle=`rgba(255,255,255,${0.25+Math.random()*0.75})`;
    ctx.beginPath(); ctx.arc(Math.random()*S,Math.random()*S,r,0,6.28); ctx.fill();
  }
  // Луна
  ctx.fillStyle='rgba(215,232,255,0.92)';
  ctx.beginPath(); ctx.arc(S*0.72,S*0.24,17,0,6.28); ctx.fill();
  const gl=ctx.createRadialGradient(S*0.72,S*0.24,14,S*0.72,S*0.24,58);
  gl.addColorStop(0,'rgba(160,200,255,0.35)'); gl.addColorStop(1,'rgba(160,200,255,0)');
  ctx.fillStyle=gl; ctx.beginPath(); ctx.arc(S*0.72,S*0.24,58,0,6.28); ctx.fill();
  return texFromCanvas(c);
}

function glowTexture(){
  const S=128, c=makeCanvas(S,S), ctx=c.getContext('2d');
  const g=ctx.createRadialGradient(S/2,S/2,0,S/2,S/2,S/2);
  g.addColorStop(0,   'rgba(255,255,255,1)');
  g.addColorStop(0.18,'rgba(255,255,255,0.62)');
  g.addColorStop(0.5, 'rgba(255,255,255,0.16)');
  g.addColorStop(1,   'rgba(255,255,255,0)');
  ctx.fillStyle=g; ctx.fillRect(0,0,S,S);
  return texFromCanvas(c);
}

function portalTexture(){
  const S=256, c=makeCanvas(S,S), ctx=c.getContext('2d');
  ctx.fillStyle='#000'; ctx.fillRect(0,0,S,S);
  const g=ctx.createRadialGradient(S/2,S/2,2,S/2,S/2,S/2);
  g.addColorStop(0,  '#ffffff');
  g.addColorStop(0.16,'#b6ecff');
  g.addColorStop(0.42,'#3a78ff');
  g.addColorStop(0.75,'#12185a');
  g.addColorStop(1,  '#000006');
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(S/2,S/2,S/2,0,6.28); ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.5)'; ctx.lineWidth=2;
  for(let a=0;a<26;a++){
    ctx.beginPath();
    let started=false;
    for(let t=0;t<16;t+=0.12){
      const r=6+t*11+a*1.6;
      if(r>S/2-4) break;
      const x=S/2+Math.cos(t+a*0.55)*r, y=S/2+Math.sin(t+a*0.55)*r;
      if(!started){ ctx.moveTo(x,y); started=true; } else ctx.lineTo(x,y);
    }
    ctx.stroke();
  }
  return texFromCanvas(c);
}

function swirlTexture(){
  const S=128, c=makeCanvas(S,S), ctx=c.getContext('2d');
  ctx.fillStyle='#2a1a0c'; ctx.fillRect(0,0,S,S);
  ctx.fillStyle='#c9a24a';
  for(let i=0;i<5;i++){ ctx.beginPath(); ctx.arc(S/2,S/2,10+i*11,0,6.28); ctx.stroke(); }
  ctx.strokeStyle='#c9a24a'; ctx.lineWidth=2;
  for(let i=0;i<5;i++){ ctx.beginPath(); ctx.arc(S/2,S/2,10+i*11,0,6.28); ctx.stroke(); }
  return texFromCanvas(c);
}

/* ── Тайны/Твины ─────────────────────────────────────────── */
const tweens = [];
function getPath(o,p){ return p.split('.').reduce((a,k)=>a[k],o); }
function setPath(o,p,v){ const parts=p.split('.'); const last=parts.pop(); parts.reduce((a,k)=>a[k],o)[last]=v; }
function tween(obj, props, dur, delay=0, onDone=null){
  const start={};
  for(const k in props) start[k]=getPath(obj,k);
  tweens.push({obj, props, start, dur, delay, t:0, onDone});
}
function updateTweens(dt){
  for(let i=tweens.length-1;i>=0;i--){
    const tw=tweens[i];
    if(tw.delay>0){ tw.delay-=dt; continue; }
    tw.t+=dt;
    let k=Math.min(tw.t/tw.dur,1);
    k = k<0.5 ? 2*k*k : 1-Math.pow(-2*k+2,2)/2;
    for(const p in tw.props) setPath(tw.obj,p, tw.start[p]+(tw.props[p]-tw.start[p])*k);
    if(tw.t>=tw.dur){
      for(const p in tw.props) setPath(tw.obj,p,tw.props[p]);
      tweens.splice(i,1);
      if(tw.onDone) tw.onDone();
    }
  }
}

/* ── Звук ───────────────────────────────────────────────── */
let actx=null;
function beep(freq=440, dur=0.12, type='sine', vol=0.07){
  if(!actx) return;
  try{
    const o=actx.createOscillator(), g=actx.createGain();
    o.type=type; o.frequency.setValueAtTime(freq, actx.currentTime);
    g.gain.setValueAtTime(vol, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime+dur);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime+dur+0.02);
  }catch(e){}
}
function chord(freqs, dur=0.5){
  freqs.forEach((f,i)=>setTimeout(()=>beep(f,dur,'sine',0.06), i*70));
}

/* ══════════════════════════════════════════════════════════
   РЕНДЕРЕР / СЦЕНА
   ══════════════════════════════════════════════════════════ */
const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.xr.enabled = true;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x04060c);
scene.fog = new THREE.Fog(0x04060c, 9, 32);

const camera = new THREE.PerspectiveCamera(72, window.innerWidth/window.innerHeight, 0.05, 70);
camera.position.set(0, 1.62, 0);

// Риг — чтобы в VR игрок стоял в нужной точке комнаты
const rig = new THREE.Group();
rig.position.set(0, 0, 3.2);
rig.add(camera);
scene.add(rig);

/* ── Размеры комнаты ────────────────────────────────────── */
const RW = 11, RD = 11, RH = 4.4;
const HX = RW/2, HZ = RD/2;

/* ── Палитра материалов ─────────────────────────────────── */
const glowTex = glowTexture();
const MAT = {
  woodDark : new THREE.MeshStandardMaterial({ color:0x3a2414, roughness:0.92, metalness:0.02 }),
  wood     : new THREE.MeshStandardMaterial({ color:0x6b4526, roughness:0.85, metalness:0.03 }),
  woodLite : new THREE.MeshStandardMaterial({ color:0x8a5f38, roughness:0.8,  metalness:0.03 }),
  iron     : new THREE.MeshStandardMaterial({ color:0x2a2a32, roughness:0.5,  metalness:0.85 }),
  brass    : new THREE.MeshStandardMaterial({ color:0xa88b45, roughness:0.32, metalness:0.92 }),
  stone    : new THREE.MeshStandardMaterial({ color:0x55555f, roughness:0.95, metalness:0.02 }),
  stoneDark: new THREE.MeshStandardMaterial({ color:0x33333c, roughness:0.96 }),
  paper    : new THREE.MeshStandardMaterial({ color:0xd8c8a2, roughness:0.92 }),
  glass    : new THREE.MeshStandardMaterial({ color:0x8fd0ff, roughness:0.08, metalness:0.15,
                                              transparent:true, opacity:0.32, side:THREE.DoubleSide }),
  cloth    : new THREE.MeshStandardMaterial({ color:0x7a2436, roughness:0.95 }),
};

/* ── Корневые группы для интерактива ────────────────────── */
const interactables = [];

/* ══════════════════════════════════════════════════════════
   ПОСТРОЕНИЕ КОМНАТЫ
   ══════════════════════════════════════════════════════════ */
function buildRoom(){
  // Пол
  const fTex = woodTexture('#4a3220','#221305','#7a5636', 12, false);
  fTex.repeat.set(6,6);
  const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(RW, RD),
    new THREE.MeshStandardMaterial({ map:fTex, roughness:0.9, metalness:0.02 })
  );
  floor.rotation.x = -Math.PI/2;
  floor.receiveShadow = true;
  scene.add(floor);

  // Стены
  const sTex = stoneTexture();
  const wallMat = new THREE.MeshStandardMaterial({ map:sTex, roughness:0.96, metalness:0.02 });
  const wGeo = new THREE.PlaneGeometry(RW, RH);
  const walls = [
    [0, RH/2, -HZ, 0],
    [0, RH/2,  HZ, Math.PI],
    [-HX, RH/2, 0, Math.PI/2],
    [ HX, RH/2, 0, -Math.PI/2],
  ];
  walls.forEach(([x,y,z,ry])=>{
    const w = new THREE.Mesh(wGeo, wallMat);
    w.position.set(x,y,z); w.rotation.y = ry;
    w.receiveShadow = true;
    scene.add(w);
  });

  // Потолок
  const ceil = new THREE.Mesh(
    new THREE.PlaneGeometry(RW, RD),
    new THREE.MeshStandardMaterial({ color:0x16110c, roughness:1 })
  );
  ceil.rotation.x = Math.PI/2;
  ceil.position.y = RH;
  scene.add(ceil);

  // Балки
  for(let i=0;i<5;i++){
    const b = new THREE.Mesh(new THREE.BoxGeometry(RW, 0.16, 0.22), MAT.woodDark);
    b.position.set(0, RH-0.1, -HZ + 1.1 + i*2.2);
    scene.add(b);
  }

  // Плинтус
  const skirtMat = new THREE.MeshStandardMaterial({ color:0x2a1c10, roughness:0.9 });
  const skirts = [
    [0, 0.09, -HZ+0.05, RW, 0],
    [0, 0.09,  HZ-0.05, RW, 0],
    [-HX+0.05, 0.09, 0, RD, Math.PI/2],
    [ HX-0.05, 0.09, 0, RD, Math.PI/2],
  ];

  for(let i=0;i<3;i++){
    const b = new THREE.Mesh(new THREE.BoxGeometry(0.30,0.055,0.22),
      new THREE.MeshStandardMaterial({ color: bookCols[i], roughness:0.85 }));
    b.position.set(0.55, 0.87 + i*0.056, -0.30);

    new THREE.MeshStandardMaterial({color:0xe8dcc0, roughness:0.9}));
  candle.position.set(-0.78,0.955,0.26); g.add(candle);
  const holder = new THREE.Mesh(new THREE.CylinderGeometry(0.075,0.09,0.03,12), MAT.brass);
  holder.position.set(-0.78,0.855,0.26); g.add(holder);

    map: glowTex, color:0xffb050, blending:THREE.AdditiveBlending,
    transparent:true, depthWrite:false
  }));
  flame.position.set(-0.78,1.10,0.26);
  flame.scale.set(0.30,0.34,1);
  g.add(flame);

  const cl = new THREE.PointLight(0xffa545, 2.2, 5.2, 2);
  cl.position.set(-0.78,1.10,0.26);
  g.add(cl);
  candleLights.push({ light: cl, sprite: flame, base: 2.2, phase: Math.random()*10 });

  /* --- Записки --- */
  const noteTex = (()=>{
    const c = makeCanvas(256,256), ctx = c.getContext('2d');
    ctx.fillStyle='#d9c9a3'; ctx.fillRect(0,0,256,256);
    for(let i=0;i<2500;i++){
      ctx.fillStyle=`rgba(120,90,50,${Math.random()*0.08})`;
      ctx.fillRect(Math.random()*256, Math.random()*256, 3,3);
    }
    ctx.strokeStyle='#4a3520'; ctx.lineWidth=3;
    for(let i=0;i<7;i++){
      ctx.beginPath();
      ctx.moveTo(34, 60+i*22);
      ctx.lineTo(34 + (130+Math.random()*80), 60+i*22);
      ctx.stroke();
    }
    ctx.beginPath(); ctx.arc(200,200,26,0,6.28); ctx.strokeStyle='#8a2020'; ctx.stroke();
    return texFromCanvas(c);
  })();

  const note1 = new THREE.Mesh(new THREE.PlaneGeometry(0.28,0.34),

  note1.rotation.x = -Math.PI/2; note1.rotation.z = 0.22;
  note1.position.set(0.02,0.856,0.18);
  g.add(note1);

  const note2 = new THREE.Mesh(new THREE.PlaneGeometry(0.30,0.24),
    new THREE.MeshStandardMaterial({ map: noteTex, roughness:0.95, side:THREE.DoubleSide }));
  note2.rotation.x = -Math.PI/2; note2.rotation.z = -0.55;
  note2.position.set(-0.34,0.856,-0.05);
  g.add(note2);

  // Интерактив записок
  const n1Hit = new THREE.Mesh(new THREE.BoxGeometry(0.4,0.3,0.4),
    new THREE.MeshBasicMaterial({visible:false}));
  n1Hit.position.copy(note1.position); n1Hit.position.y = 0.9;
  n1Hit.userData.onTap = ()=>{ beep(660,0.09,'triangle',0.05);
    say('«Ключ от сундука спрятан в книге, что светится золотом.»', 5); };
  g.add(n1Hit); interactables.push(n1Hit);

  const n2Hit = new THREE.Mesh(new THREE.BoxGeometry(0.4,0.3,0.4),
    new THREE.MeshBasicMaterial({visible:false}));
  n2Hit.position.copy(note2.position); n2Hit.position.y = 0.9;
  n2Hit.userData.onTap = ()=>{ beep(620,0.09,'triangle',0.05);
    say('«Стихии слушают лишь древний порядок. Смотри на знак у пьедестала.»', 5); };
  g.add(n2Hit); interactables.push(n2Hit);

  /* --- Глобус (тайник) --- */
  const globe = new THREE.Group();
  globe.position.set(0.62, 0.855, 0.20);
  g.add(globe);

  // Подставка
  const stand = new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.13,0.06,14), MAT.woodDark);
  stand.position.y = 0.03; globe.add(stand);
  const col = new THREE.Mesh(new THREE.CylinderGeometry(0.02,0.02,0.10,8), MAT.brass);
  col.position.y = 0.11; globe.add(col);

  // Меридиан
  const ring = new THREE.Mesh(new THREE.TorusGeometry(0.135,0.012,8,24), MAT.brass);
  ring.rotation.y = Math.PI/2;
  ring.position.y = 0.255;
  globe.add(ring);

  // Сфера — верхняя и нижняя половины
  const globeMat = new THREE.MeshStandardMaterial({
    color:0x2f6b8a, roughness:0.55, metalness:0.25,
    emissive:0x0a2030, emissiveIntensity:0.5
  });
  const lower = new THREE.Mesh(
    new THREE.SphereGeometry(0.115, 18, 12, 0, Math.PI*2, Math.PI/2, Math.PI/2), globeMat);
  lower.position.y = 0.255; globe.add(lower);

  const upperPivot = new THREE.Group();
  upperPivot.position.set(0, 0.255, 0);
  globe.add(upperPivot);
  const upper = new THREE.Mesh(
    new THREE.SphereGeometry(0.115, 18, 12, 0, Math.PI*2, 0, Math.PI/2), globeMat);
  upperPivot.add(upper);

  // Континенты
  for(let i=0;i<7;i++){
    const p = new THREE.Mesh(new THREE.SphereGeometry(0.019,6,5),
      new THREE.MeshStandardMaterial({color:0x3f8a4a, roughness:0.9}));
    const th = rand(0,Math.PI*2), ph = rand(0.4,2.2);
    p.position.set(
      Math.sin(ph)*Math.cos(th)*0.113,
      Math.cos(ph)*0.113,
      Math.sin(ph)*Math.sin(th)*0.113
    );
    lower.add(p);
  }

  // Кристалл внутри (рубин) — появится при открытии
  globe.userData.upperPivot = upperPivot;
  globe.userData.opened = false;
  globe.userData.crystalPos = new THREE.Vector3(0, 0.34, 0);

  const globeHit = new THREE.Mesh(new THREE.SphereGeometry(0.22,8,6),
    new THREE.MeshBasicMaterial({visible:false}));
  globeHit.position.y = 0.25;
  globe.add(globeHit);

  globeHit.userData.onTap = ()=>{ openGlobe(); };
  interactables.push(globeHit);

  return { group:g, globe };
}

let goldenBook = null;
function buildBookshelf(){
  const g = new THREE.Group();
  g.position.set(2.45, 0, -HZ + 0.28);
  scene.add(g);

  const W = 2.3, H = 2.6, D = 0.42;
  const side = new THREE.MeshStandardMaterial({
    map: woodTexture('#4a3018','#241505','#7a5636', 6, true), roughness:0.85 });

  // Каркас
  const back = new THREE.Mesh(new THREE.BoxGeometry(W,H,0.04), MAT.woodDark);
  back.position.set(0,H/2,-D/2); g.add(back);

  [-1,1].forEach(s=>{
    const p = new THREE.Mesh(new THREE.BoxGeometry(0.06,H,D), side);
    p.position.set(s*W/2, H/2, 0); p.castShadow = true; g.add(p);
  });
  const topP = new THREE.Mesh(new THREE.BoxGeometry(W,0.07,D), side);
  topP.position.set(0,H,0); g.add(topP);
  const botP = new THREE.Mesh(new THREE.BoxGeometry(W,0.07,D), side);
  botP.position.set(0,0.06,0); g.add(botP);

  // Полки + книги
  const shelfYs = [0.62, 1.24, 1.86, 2.45];
  const bookCols = [0x7a2d2d,0x2d4a7a,0x2d6b45,0x6b5a2d,0x4a2d6b,0x8a5a2d,0x2d5a6b,0x5c3a2a];

  shelfYs.forEach((y, si)=>{
    const sh = new THREE.Mesh(new THREE.BoxGeometry(W-0.12,0.05,D-0.04), side);
    sh.position.set(0,y,0.02);
    sh.receiveShadow = true;
    g.add(sh);

    // Книги
    let x = -W/2 + 0.14;
    while(x < W/2 - 0.16){
      const bw = rand(0.045,0.095);
      const bh = rand(0.30,0.44);
      const bd = rand(0.24,0.32);
      if(x + bw > W/2 - 0.12) break;

      const isGolden = (si === 3 && !goldenBook && x > -0.2 && x < 0.4 && Math.random() < 0.28);

      const mat = isGolden
        ? new THREE.MeshStandardMaterial({ color:0xd9a233, roughness:0.35, metalness:0.55,
            emissive:0x8a5a10, emissiveIntensity:0.55 })
        : new THREE.MeshStandardMaterial({ color: pick(bookCols), roughness:0.88 });

      const b = new THREE.Mesh(new THREE.BoxGeometry(bw, bh, bd), mat);
      b.position.set(x + bw/2, y + 0.025 + bh/2, 0.02);
      b.rotation.z = rand(-0.015,0.015);
      b.castShadow = true;
      g.add(b);

      // Корешок-декор
      const strip = new THREE.Mesh(new THREE.BoxGeometry(bw*1.02, 0.018, bd*1.01),
        new THREE.MeshStandardMaterial({ color: isGolden?0xffe08a:0xc9a24a,
          roughness:0.4, metalness:0.6, emissive: isGolden?0x6a4410:0x000000,
          emissiveIntensity: isGolden?0.8:0 }));
      strip.position.set(x + bw/2, y + 0.025 + bh*0.72, 0.02);
      g.add(strip);

      if(isGolden){
        goldenBook = b;
        b.userData.isGolden = true;
        // Ореол
        const halo = new THREE.Sprite(new THREE.SpriteMaterial({
          map: glowTex, color:0xffcc55, blending:THREE.AdditiveBlending,
          transparent:true, depthWrite:false, opacity:0.55
        }));
        halo.scale.set(0.55,0.55,1);
        halo.position.copy(b.position);
        g.add(halo);
        b.userData.halo = halo;

        // Невидимая зона нажатия
        const hit = new THREE.Mesh(new THREE.BoxGeometry(0.30,0.55,0.42),
          new THREE.MeshBasicMaterial({visible:false}));
        hit.position.copy(b.position);
        hit.userData.onTap = ()=> findKey(b);
        g.add(hit);
        interactables.push(hit);
      }

      x += bw + rand(0.004,0.014);

      // Случайный наклон книги
      if(Math.random() < 0.06){
        b.rotation.z = rand(0.12,0.28);
        b.position.y -= 0.02;
      }
    }

    // Декор на полках
    if(si === 0){
      // Свитки
      for(let i=0;i<3;i++){
        const sc = new THREE.Mesh(new THREE.CylinderGeometry(0.028,0.028,0.24,8),
          new THREE.MeshStandardMaterial({color:0xd8c8a2, roughness:0.92}));
        sc.rotation.z = Math.PI/2;
        sc.rotation.y = rand(-0.2,0.2);
        sc.position.set(0.82 + i*0.07, y + 0.06, 0.04);
        g.add(sc);
      }
    }
    if(si === 1){
      // Череп
      const skull = new THREE.Group();
      skull.position.set(0.85, y + 0.11, 0.03);
      const sk = new THREE.Mesh(new THREE.SphereGeometry(0.075,10,8),
        new THREE.MeshStandardMaterial({color:0xd8d0bc, roughness:0.9}));
      skull.add(sk);
      const jaw = new THREE.Mesh(new THREE.BoxGeometry(0.09,0.045,0.075),
        new THREE.MeshStandardMaterial({color:0xd8d0bc, roughness:0.9}));
      jaw.position.y = -0.072; skull.add(jaw);
      [-0.028,0.028].forEach(dx=>{
        const eye = new THREE.Mesh(new THREE.SphereGeometry(0.018,8,6),
          new THREE.MeshStandardMaterial({color:0x0a0a0a, roughness:0.4}));
        eye.position.set(dx, 0.015, 0.062); skull.add(eye);
      });
      g.add(skull);
    }
    if(si === 2){
      // Склянки
      const potCols = [0x39d98a, 0xd93a6a, 0x3a8bd9];
      for(let i=0;i<3;i++){
        const pot = new THREE.Group();
        pot.position.set(0.70 + i*0.13, y + 0.045, 0.03);
        const body = new THREE.Mesh(new THREE.CylinderGeometry(0.038,0.045,0.11,10),
          new THREE.MeshStandardMaterial({ color: potCols[i], transparent:true, opacity:0.72,
            roughness:0.15, metalness:0.1, emissive: potCols[i], emissiveIntensity:0.5 }));
        body.position.y = 0.055; pot.add(body);
        const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.016,0.016,0.05,8),
          new THREE.MeshStandardMaterial({color:0xbfd8e8, transparent:true, opacity:0.5, roughness:0.1}));
        neck.position.y = 0.135; pot.add(neck);
        const cork = new THREE.Mesh(new THREE.CylinderGeometry(0.018,0.018,0.02,8), MAT.woodDark);
        cork.position.y = 0.165; pot.add(cork);
        g.add(pot);
      }
    }
  });

  return g;
}

let chestRef = null;
function buildChest(){
  const g = new THREE.Group();
  g.position.set(3.95, 0, 2.15);
  g.rotation.y = -0.7;
  scene.add(g);

  const woodMat = new THREE.MeshStandardMaterial({
    map: woodTexture('#5a3a1e','#241305','#8a6038', 5, true), roughness:0.85 });

  // Корпус
  const body = new THREE.Mesh(new THREE.BoxGeometry(0.95, 0.52, 0.62), woodMat);
  body.position.y = 0.26;
  body.castShadow = true; body.receiveShadow = true;
  g.add(body);

  // Металлические полосы
  [-0.30, 0.30].forEach(x=>{
    const band = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.55, 0.66), MAT.iron);
    band.position.set(x, 0.27, 0); g.add(band);
  });
  // Уголки
  [[-0.44,-0.28],[0.44,-0.28],[-0.44,0.28],[0.44,0.28]].forEach(([x,z])=>{
    const c = new THREE.Mesh(new THREE.BoxGeometry(0.10,0.56,0.10), MAT.iron);
    c.position.set(x,0.27,z); g.add(c);
  });

  // Крышка (полуцилиндр), ось — задний край
  const lidPivot = new THREE.Group();
  lidPivot.position.set(0, 0.52, -0.31);
  g.add(lidPivot);

  const lidGeo = new THREE.CylinderGeometry(0.31, 0.31, 0.95, 18, 1, false, 0, Math.PI);
  lidGeo.rotateZ(Math.PI/2);
  const lid = new THREE.Mesh(lidGeo, woodMat);
  lid.position.set(0, 0, 0.31);
  lid.castShadow = true;
  lidPivot.add(lid);

  [-0.30, 0.30].forEach(x=>{
    const bandGeo = new THREE.CylinderGeometry(0.318, 0.318, 0.09, 18, 1, false, 0, Math.PI);
    bandGeo.rotateZ(Math.PI/2);
    const band = new THREE.Mesh(bandGeo, MAT.iron);
    band.position.set(x, 0, 0.31);
    lidPivot.add(band);
  });

  // Замок
  const lock = new THREE.Mesh(new THREE.BoxGeometry(0.14,0.14,0.06), MAT.brass);
  lock.position.set(0, 0.47, 0.34);
  g.add(lock);
  const keyhole = new THREE.Mesh(new THREE.CylinderGeometry(0.018,0.018,0.02,8),
    new THREE.MeshStandardMaterial({color:0x0a0a0a}));
  keyhole.rotation.x = Math.PI/2;
  keyhole.position.set(0,0.47,0.375);
  g.add(keyhole);

  // Точка появления кристалла
  const crystalPos = new THREE.Vector3(0, 0.85, 0.02);

  const hit = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.9, 0.8),
    new THREE.MeshBasicMaterial({visible:false}));
  hit.position.y = 0.45;
  hit.userData.onTap = ()=> openChest();
  g.add(hit);
  interactables.push(hit);

  chestRef = { group:g, lidPivot, opened:false, crystalPos, localCrystalPos: crystalPos };
  return g;
}

      new THREE.MeshStandardMaterial({color:0x1c1c24, roughness:0.85}));
    socket.position.set(x, 1.145, 0);

  /* ── Табличка с порядком на передней грани ── */
  const plate = new THREE.Mesh(new THREE.BoxGeometry(0.42,0.52,0.035),
    new THREE.MeshStandardMaterial({color:0x4a4a55, roughness:0.8, metalness:0.15}));
  plate.position.set(0, 0.60, 0.305);
  g.add(plate);

  const dotCols = [0x33e07a, 0xff3b5c, 0x3f8bff];
  for(let i=0;i<3;i++){
    const dot = new THREE.Mesh(new THREE.CircleGeometry(0.045, 14),
      new THREE.MeshBasicMaterial({color: dotCols[i]}));

    g.add(dot);

    // Свечение
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({
      map:glowTex, color:dotCols[i], blending:THREE.AdditiveBlending,
      transparent:true, depthWrite:false, opacity:0.85 }));
    sp.scale.set(0.24,0.24,1);
    sp.position.copy(dot.position);
    g.add(sp);
  }

  // Стрелки между точками
  for(let i=0;i<2;i++){
    const arr = new THREE.Mesh(new THREE.ConeGeometry(0.026, 0.05, 4),
      new THREE.MeshBasicMaterial({color:0x9aa8bb}));
    arr.rotation.z = Math.PI;
    arr.position.set(0, 0.685 - i*0.16, 0.325);
    g.add(arr);
  }

  // Хитбокс таблички
  const plateHit = new THREE.Mesh(new THREE.BoxGeometry(0.5,0.6,0.25),
    new THREE.MeshBasicMaterial({visible:false}));
  plateHit.position.set(0,0.60,0.32);
  plateHit.userData.onTap = ()=>{
    beep(700,0.1,'triangle',0.05);
    say('Древний знак: изумруд → рубин → сапфир.', 5);

  /* ── Портал (скрыт) ── */
  const portal = new THREE.Group();
  portal.position.set(0, 2.05, 0);

  portal.visible = false;
  g.add(portal);

  const ring = new THREE.Mesh(new THREE.TorusGeometry(0.82, 0.055, 12, 48),

      emissiveIntensity:1.6, roughness:0.3, metalness:0.6}));

  const disc = new THREE.Mesh(new THREE.CircleGeometry(0.80, 40),
    new THREE.MeshBasicMaterial({ map: portalTexture(),
      blending:THREE.AdditiveBlending, transparent:true, depthWrite:false,
      side:THREE.DoubleSide }));
  portal.add(disc);

  const portalLight = new THREE.PointLight(0x66aaff, 0, 9, 2);
  portalLight.position.set(0, 0, 0.5);
  portal.add(portalLight);

  pedestalRef = { group:g, portal, disc, ring, portalLight, slots:[], slotXs };

  // Точки-гнезда (мировые)
  pedestalRef.slotWorld = slotXs.map(x => new THREE.Vector3(x, 1.24, 0.3));
  return g;
}

let paintingRef = null;
function buildPainting(){
  const g = new THREE.Group();
  g.position.set(-HX + 0.17, 1.72, 1.0);   // шарнир у края
  g.rotation.y = Math.PI/2;
  scene.add(g);

  const W = 1.2, H = 1.32, cx = W/2;  // смещение центра от шарнира

  // Холст
  const canvasTex = (()=>{
    const c = makeCanvas(320,352), ctx=c.getContext('2d');
    const grd = ctx.createLinearGradient(0,0,0,352);
    grd.addColorStop(0,'#1a2438'); grd.addColorStop(1,'#0a0f1c');
    ctx.fillStyle=grd; ctx.fillRect(0,0,320,352);
    // Горы
    ctx.fillStyle='#141c2e';
    ctx.beginPath(); ctx.moveTo(0,300);
    for(let x=0;x<=320;x+=20) ctx.lineTo(x, 250 + Math.sin(x*0.03)*28 + Math.random()*10);
    ctx.lineTo(320,352); ctx.lineTo(0,352); ctx.fill();
    // Башня
    ctx.fillStyle='#232b3e'; ctx.fillRect(150,150,34,120);
    ctx.beginPath(); ctx.moveTo(144,150); ctx.lineTo(167,110); ctx.lineTo(190,150); ctx.fill();
    ctx.fillStyle='#e8c66a'; ctx.fillRect(160,190,8,12); ctx.fillRect(168,215,8,12);
    // Луна
    ctx.fillStyle='rgba(220,235,255,0.85)';
    ctx.beginPath(); ctx.arc(70,70,22,0,6.28); ctx.fill();
    // Звёзды
    for(let i=0;i<80;i++){
      ctx.fillStyle=`rgba(255,255,255,${0.2+Math.random()*0.7})`;
      ctx.fillRect(Math.random()*320, Math.random()*160, 1.5, 1.5);
    }
    return texFromCanvas(c);
  })();

  const canvasMat = new THREE.MeshStandardMaterial({
    map: canvasTex, roughness:0.85, emissive:0x0a1220, emissiveIntensity:0.4 });
  const cv = new THREE.Mesh(new THREE.BoxGeometry(W, H, 0.025), canvasMat);
  cv.position.set(cx, 0, 0);
  cv.castShadow = true;
  g.add(cv);

  // Рама
  const fr = new THREE.MeshStandardMaterial({color:0xb8963f, roughness:0.35, metalness:0.85});
  const fw = 0.07;
  [[cx, H/2+fw/2, W+fw*2, fw],[cx, -H/2-fw/2, W+fw*2, fw]].forEach(([x,y,w,h])=>{
    const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,0.09), fr);
    m.position.set(x,y,0); m.castShadow = true; g.add(m);
  });
  [[cx-W/2-fw/2, W*0+fw],[cx+W/2+fw/2, fw]].forEach(([x,w])=>{
    const m = new THREE.Mesh(new THREE.BoxGeometry(w,H+fw*2,0.09), fr);
    m.position.set(x,0,0); m.castShadow = true; g.add(m);
  });

  const hit = new THREE.Mesh(new THREE.BoxGeometry(W+0.24, H+0.24, 0.3),
    new THREE.MeshBasicMaterial({visible:false}));
  hit.position.set(cx, 0, 0);
  hit.userData.onTap = ()=> movePainting();
  g.add(hit);
  interactables.push(hit);

  paintingRef = { group:g, moved:false, baseRotY: Math.PI/2 };
  return g;
}

const candleLights = [];
function buildChandelier(){
  const g = new THREE.Group();
  g.position.set(0, 0, 0.5);
  scene.add(g);

  // Цепь
  for(let i=0;i<6;i++){
    const link = new THREE.Mesh(new THREE.TorusGeometry(0.03,0.008,6,12), MAT.iron);
    link.position.set(0, RH - 0.35 - i*0.075, 0);
    link.rotation.y = i%2 ? Math.PI/2 : 0;
    g.add(link);
  }

  const y = RH - 0.90;
  const ring = new THREE.Mesh(new THREE.TorusGeometry(0.62,0.028,10,32), MAT.iron);
  ring.rotation.x = Math.PI/2;
  ring.position.y = y;
  g.add(ring);

  // Спицы
  for(let i=0;i<5;i++){
    const a = i/5*Math.PI*2;
    const spoke = new THREE.Mesh(new THREE.BoxGeometry(0.62,0.02,0.02), MAT.iron);
    spoke.position.set(Math.cos(a)*0.31, y+0.01, Math.sin(a)*0.31);
    spoke.rotation.y = -a;
    g.add(spoke);
  }

  // Свечи
  for(let i=0;i<5;i++){
    const a = i/5*Math.PI*2;
    const cx = Math.cos(a)*0.62, cz = Math.sin(a)*0.62;

    const cup = new THREE.Mesh(new THREE.CylinderGeometry(0.055,0.04,0.05,10), MAT.brass);
    cup.position.set(cx, y+0.05, cz); g.add(cup);

    const cnd = new THREE.Mesh(new THREE.CylinderGeometry(0.026,0.030,0.20,10),
      new THREE.MeshStandardMaterial({color:0xe8dcc0, roughness:0.9}));
    cnd.position.set(cx, y+0.17, cz); g.add(cnd);

    const fl = new THREE.Sprite(new THREE.SpriteMaterial({
      map: glowTex, color:0xffb050, blending:THREE.AdditiveBlending,
      transparent:true, depthWrite:false }));
    fl.position.set(cx, y+0.30, cz);
    fl.scale.set(0.26,0.30,1);
    g.add(fl);

    const lt = new THREE.PointLight(0xffa545, 1.7, 6.5, 2);
    lt.position.set(cx, y+0.30, cz);
    g.add(lt);

    candleLights.push({ light: lt, sprite: fl, base: 1.7, phase: Math.random()*10 });
  }

  // Центральное свечение
  const core = new THREE.PointLight(0xffb066, 1.2, 8, 2);
  core.position.set(0, y, 0);
  g.add(core);
  candleLights.push({ light: core, sprite: null, base: 1.2, phase: Math.random()*10 });

  return g;
}

const CRYSTALS = {
  emerald:  { name:'Изумруд', color:0x33e07a },
  ruby:     { name:'Рубин',   color:0xff3b5c },
  sapphire: { name:'Сапфир',  color:0x3f8bff },
};
const ORDER = ['emerald','ruby','sapphire'];

const crystalGeo = new THREE.OctahedronGeometry(0.085, 0);

function makeCrystal(id){
  const def = CRYSTALS[id];
  const g = new THREE.Group();

  const core = new THREE.Mesh(crystalGeo, new THREE.MeshStandardMaterial({
    color: def.color, emissive: def.color, emissiveIntensity: 1.15,
    roughness: 0.12, metalness: 0.25, transparent: true, opacity: 0.92,
    flatShading: true
  }));
  core.scale.set(1, 1.75, 1);
  g.add(core);

  // Внутреннее ядро
  const inner = new THREE.Mesh(crystalGeo, new THREE.MeshBasicMaterial({
    color: 0xffffff, transparent:true, opacity:0.35 }));
  inner.scale.set(0.42, 0.75, 0.42);
  g.add(inner);

  // Ореол
  const halo = new THREE.Sprite(new THREE.SpriteMaterial({
    map: glowTex, color: def.color, blending: THREE.AdditiveBlending,
    transparent: true, depthWrite: false, opacity: 0.9 }));
  halo.scale.set(0.72, 0.72, 1);
  g.add(halo);

  // Хитбокс
  const hit = new THREE.Mesh(new THREE.SphereGeometry(0.24, 8, 6),
    new THREE.MeshBasicMaterial({visible:false}));
  g.add(hit);

  g.userData.id = id;
  g.userData.core = core;
  g.userData.halo = halo;
  g.userData.hit = hit;
  g.userData.spin = rand(0.6, 1.2);

  return g;
}

/* --- 5. Собрать кристалл --- */
function collectCrystal(id, group){
  if(game.collected.includes(id)) return;
  game.collected.push(id);
  updateInv();

  beep(CRYSTALS[id].color === 0x33e07a ? 700 : (id==='ruby'? 620 : 780),
       0.18, 'sine', 0.07);
  setTimeout(()=>beep(1000, 0.25, 'sine', 0.05), 90);

  say(`Собран ${CRYSTALS[id].name}!`, 2.5);

  // Убираем из мира
  const idx = interactables.indexOf(group.userData.hit);
  if(idx >= 0) interactables.splice(idx,1);
  scene.remove(group);

  // Добавляем в орбиту у пьедестала
  const oc = makeCrystal(id);
  oc.scale.setScalar(0.01);
  oc.position.set(0, 1.6, 0.3);
  scene.add(oc);
  oc.userData.hit.userData.onTap = ()=> placeCrystal(id, oc);
  interactables.push(oc.userData.hit);

  tween(oc, { 'scale.x':1, 'scale.y':1, 'scale.z':1 }, 0.5);

  orbitCrystals.push({ id, group: oc });

  if(game.collected.length === 3){
    setTimeout(()=>{
      setObjective('Установи кристаллы в правильном порядке');
      say('Все кристаллы собраны! Изучи знак на пьедестале.', 5);
      chord([523,659,784,1047], 0.4);
    }, 900);
  } else {
    setObjective(`Кристаллы: ${game.collected.length}/3`);
  }
}

/* --- 6. Установка кристалла в пьедестал --- */
function placeCrystal(id, group){
  if(game.solved) return;
  if(game.placed.includes(id)) return;

  const slotIndex = game.placed.length;
  if(slotIndex >= 3) return;

  game.placed.push(id);

  // Убираем из орбиты
  const oi = orbitCrystals.findIndex(o=>o.id === id);
  if(oi >= 0) orbitCrystals.splice(oi,1);

  const target = pedestalRef.slotWorld[slotIndex];
  const targetPos = new THREE.Vector3(target.x, 1.24, target.z);

  beep(660 + slotIndex*120, 0.14, 'sine', 0.06);

  tween(group, {
    'position.x': targetPos.x,
    'position.y': targetPos.y,
    'position.z': targetPos.z,
  }, 0.7, 0, ()=>{
    group.userData.placed = true;
    group.userData.baseY = targetPos.y;
  });
  tween(group, { 'rotation.y': Math.PI * 2 }, 0.7);

  // Хитбокс больше не нужен
  const hi = interactables.indexOf(group.userData.hit);
  if(hi >= 0) interactables.splice(hi,1);

  if(game.placed.length === 3){
    checkOrder();
  }
}

function checkOrder(){
  const ok = game.placed.every((id,i)=> id === ORDER[i]);

  if(ok){
    solveQuest();
  } else {
    // Сброс
    beep(150, 0.3, 'square', 0.07);
    setTimeout(()=>beep(110, 0.35, 'square', 0.06), 120);
    say('Порядок неверен. Кристаллы возвращаются.', 3.5);

    setTimeout(()=>{
      const placedGroups = game.placed.map(id => 
        orbitCrystals.find(o=>o.id===id)
      );
      // Вернём их (они были удалены из orbitCrystals)
      const toReturn = [];
      game.placed.forEach(id=>{
        // найдём группу по сцене
        scene.children.forEach(ch=>{
          if(ch.userData && ch.userData.id === id && ch.userData.placed) toReturn.push(ch);
        });
      });

      toReturn.forEach((g, i)=>{
        g.userData.placed = false;
        g.userData.baseY = 1.55;
        // Вернуть интерактив
        g.userData.hit.userData.onTap = ()=> placeCrystal(g.userData.id, g);
        if(!interactables.includes(g.userData.hit)) interactables.push(g.userData.hit);
        orbitCrystals.push({ id: g.userData.id, group: g });
      });

      game.placed = [];
    }, 800);
  }
}

const raycaster = new THREE.Raycaster();
const centerNDC = new THREE.Vector2(0,0);

/* ── Прицел VR ── */
const reticleEl = document.getElementById('reticle');

/* ── Гироскоп ── */
let gyroActive = false;
let gyroBaseYaw = 0;
let gyroReady = false;
const tmpQuat = new THREE.Quaternion();
const yawQuat = new THREE.Quaternion();
const zeeVec  = new THREE.Vector3(0,0,1);
const eul     = new THREE.Euler();
const q1      = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5));

function deviceQuatFromEvent(alpha, beta, gamma, orient, target){
  eul.set(beta, alpha, -gamma, 'YXZ');
  target.setFromEuler(eul);
  target.multiply(q1);
  target.multiply(new THREE.Quaternion().setFromAxisAngle(zeeVec, -orient));
}

function onDeviceOrientation(e){
  if(e.alpha === null || e.alpha === undefined) return;
  if(!gyroActive) return;

  const alpha = e.alpha * DEG;
  const beta  = e.beta  * DEG;
  const gamma = e.gamma * DEG;
  const orient = (screen.orientation && screen.orientation.angle || 0) * DEG;

  deviceQuatFromEvent(alpha, beta, gamma, orient, tmpQuat);

  if(!gyroReady){
    // Вычисляем начальный поворот, чтобы игрок смотрел в комнату
    const fwd = new THREE.Vector3(0,0,-1).applyQuaternion(tmpQuat);
    const phi = Math.atan2(fwd.x, -fwd.z);
    gyroBaseYaw = phi;
    gyroReady = true;
  }

  yawQuat.setFromAxisAngle(new THREE.Vector3(0,1,0), gyroBaseYaw);
  camera.quaternion.copy(yawQuat).multiply(tmpQuat);
}

/* ── Drag-look (если гироскоп недоступен) ── */
let lookYaw = 0, lookPitch = 0;
let dragging = false, lastPX = 0, lastPY = 0;
const tmpEuler = new THREE.Euler(0,0,0,'YXZ');

function applyLook(){
  tmpEuler.set(lookPitch, lookYaw, 0, 'YXZ');
  camera.quaternion.setFromEuler(tmpEuler);
}

/* ── Обработка тапа ── */
function handleTap(clientX, clientY){
  const ndc = new THREE.Vector2(
    (clientX / window.innerWidth) * 2 - 1,
    -(clientY / window.innerHeight) * 2 + 1
  );
  raycaster.setFromCamera(ndc, camera);
  const hits = raycaster.intersectObjects(interactables, true);
  if(!hits.length) return;

  let o = hits[0].object;
  while(o && !o.userData.onTap) o = o.parent;
  if(o && o.userData.onTap){
    ripple(clientX, clientY);
    o.userData.onTap(hits[0].point);
  }
}

/* ── События указателя ── */
const canvas = renderer.domElement;
let downX = 0, downY = 0, downT = 0, moved = false, pointerId = null;

canvas.addEventListener('pointerdown', e=>{
  if(e.pointerType === 'touch' && pointerId !== null) return;
  pointerId = e.pointerId;
  downX = e.clientX; downY = e.clientY;
  downT = performance.now();
  moved = false;
  if(!gyroActive){
    dragging = true;
    lastPX = e.clientX; lastPY = e.clientY;
  }
}, {passive:true});

canvas.addEventListener('pointermove', e=>{
  if(Math.hypot(e.clientX-downX, e.clientY-downY) > 12) moved = true;
  if(dragging && !gyroActive){
    lookYaw   -= (e.clientX - lastPX) * 0.0042;
    lookPitch -= (e.clientY - lastPY) * 0.0042;
    lookPitch = clamp(lookPitch, -Math.PI/2 + 0.08, Math.PI/2 - 0.08);
    lastPX = e.clientX; lastPY = e.clientY;
    applyLook();
  }
}, {passive:true});

function endPointer(e){
  if(e.pointerId !== pointerId) return;
  pointerId = null;
  dragging = false;
  const dt = performance.now() - downT;
  if(!moved && dt < 700){
    if(renderer.xr.isPresenting){
      // В VR — по центру
      handleTap(window.innerWidth/2, window.innerHeight/2);
    } else {
      handleTap(e.clientX, e.clientY);
    }
  }
}
canvas.addEventListener('pointerup', endPointer, {passive:true});
canvas.addEventListener('pointercancel', e=>{ pointerId=null; dragging=false; }, {passive:true});

/* ── VR-контроллеры ── */
function onXRSelect(){
  handleTap(window.innerWidth/2, window.innerHeight/2);
}
renderer.xr.addEventListener('sessionstart', ()=>{
  const session = renderer.xr.getSession();
  session.addEventListener('select', onXRSelect);
  reticleEl.style.display = 'block';
  gyroActive = false;

/* ══════════════════════════════════════════════════════════
   ЦИКЛ ОТРИСОВКИ
   ══════════════════════════════════════════════════════════ */
const clock = new THREE.Clock();
let elapsed = 0;

function animate(){
  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;

  updateTweens(dt);

  /* --- Мерцание свечей --- */
  for(const c of candleLights){
    const f = 1 + Math.sin(elapsed*11 + c.phase)*0.11
                + Math.sin(elapsed*23.7 + c.phase*2.3)*0.06
                + (Math.random()-0.5)*0.05;
    c.light.intensity = c.base * f;
    if(c.sprite){
      const s = 0.26 * (0.9 + f*0.14);
      c.sprite.scale.set(s, s*1.15, 1);
    }
  }

  /* --- Вращение кристаллов --- */
  for(const oc of orbitCrystals){
    const g = oc.group;
    if(g.userData.core) g.userData.core.rotation.y += dt * g.userData.spin;
    if(g.userData.core) g.userData.core.rotation.x += dt * 0.4;
    const halo = g.userData.halo;
    if(halo){
      const p = 0.72 + Math.sin(elapsed*3 + oc.id.length)*0.07;
      halo.scale.set(p, p, 1);
    }
  }

  /* --- Орбита вокруг пьедестала --- */
  const now = performance.now()/1000;
  orbitCrystals.forEach((oc, i)=>{
    if(oc.group.userData.placed) return;
    const a = now*0.55 + i*(Math.PI*2/Math.max(orbitCrystals.length,1));
    const R = 0.82;
    oc.group.position.set(
      Math.sin(a) * R,
      1.52 + Math.sin(now*2 + i)*0.055,
      0.3 + Math.cos(a) * R
    );
    oc.group.rotation.y = -a;
  });

  /* --- Парящие одиночные кристаллы (до сбора) --- */
  scene.children.forEach(ch=>{
    if(ch.userData && ch.userData.floating && ch.userData.id === undefined){
      // n/a
    }
  });
  // кристаллы, ждущие сбора, слегка покачиваются
  interactables.forEach(o=>{
    if(o.parent && o.parent.userData && o.parent.userData.floating && !o.parent.userData.placed){
      const g = o.parent;
      if(g.userData.baseY !== undefined){
        g.position.y = g.userData.baseY + Math.sin(elapsed*1.8 + g.userData.spin*3)*0.045;
        if(g.userData.core){
          g.userData.core.rotation.y += dt * 1.1;
          g.userData.core.rotation.x += dt * 0.3;
        }
      }
    }
  });

  /* --- Пыль --- */
  if(dust){
    const pos = dust.geometry.attributes.position.array;
    const vel = dust.userData.vel;
    for(let i=0;i<pos.length;i+=3){
      pos[i]   += vel[i]   * dt;
      pos[i+1] += vel[i+1] * dt;
      pos[i+2] += vel[i+2] * dt;
      if(pos[i+1] > RH-0.2){ pos[i+1] = 0.2; }
      if(Math.abs(pos[i]) > HX-0.3) vel[i] *= -1;
      if(Math.abs(pos[i+2]) > HZ-0.3) vel[i+2] *= -1;
    }
    dust.geometry.attributes.position.needsUpdate = true;
  }

  /* --- Портал --- */
  if(pedestalRef && pedestalRef.portal.visible){
    pedestalRef.disc.rotation.z -= dt * 0.65;
    pedestalRef.ring.rotation.z += dt * 0.28;
    const pulse = 1 + Math.sin(elapsed*3.5)*0.03;
    pedestalRef.ring.scale.setScalar(pulse);
  }

  /* --- Прицел в VR --- */
  if(renderer.xr.isPresenting){
    raycaster.setFromCamera(centerNDC, camera);
    const hits = raycaster.intersectObjects(interactables, true);
    let active = false;
    if(hits.length){
      let o = hits[0].object;
      while(o && !o.userData.onTap) o = o.parent;
      if(o && o.userData.onTap) active = true;
    }
    reticleEl.classList.toggle('active', active);
  }

  renderer.render(scene, camera);
}
renderer.setAnimationLoop(animate);

/* ══════════════════════════════════════════════════════════
   СТАРТ
   ══════════════════════════════════════════════════════════ */
const startScreen = document.getElementById('start');
const startBtn = document.getElementById('startBtn');

async function requestGyro(){
  if(typeof DeviceOrientationEvent === 'undefined') return false;
  if(typeof DeviceOrientationEvent.requestPermission === 'function'){
    try{
      const res = await DeviceOrientationEvent.requestPermission();
      return res === 'granted';
    }catch(e){ return false; }
  }
  return true;
}

startBtn.addEventListener('click', async ()=>{
  // Аудио
  try{
    actx = new (window.AudioContext || window.webkitAudioContext)();
    if(actx.state === 'suspended') await actx.resume();
  }catch(e){}

  // Гироскоп
  const ok = await requestGyro();
  if(ok){
    window.addEventListener('deviceorientation', onDeviceOrientation, true);
    // Ждём первый event
    setTimeout(()=>{
      if(!gyroReady){
        gyroActive = false;
        applyLook();
      } else {
        gyroActive = true;
      }
    }, 450);
    gyroActive = true;
  } else {
    gyroActive = false;
    applyLook();
  }

  startScreen.classList.add('hide');
  setTimeout(()=> startScreen.style.display = 'none', 850);

  setTimeout(()=>{
    setObjective('Найди 3 кристалла');
    say('Осмотри комнату. Три кристалла откроют портал.', 5);
    beep(440, 0.2, 'sine', 0.05);
  }, 900);
});

/* ── WebXR кнопка ── */
if('xr' in navigator){
  navigator.xr.isSessionSupported('immersive-vr').then(supported=>{
    if(supported){
      const btn = VRButton.createButton(renderer);
      btn.style.zIndex = '60';
      document.body.appendChild(btn);
    }
  }).catch(()=>{});
}

/* ── Ресайз ── */
window.addEventListener('resize', ()=>{
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ── Запрет масштабирования ── */
document.addEventListener('gesturestart', e=>e.preventDefault());
document.addEventListener('dblclick', e=>e.preventDefault());

/* ── Инициализация инвентаря ── */
updateInv();
</script>
</body>
</html>
