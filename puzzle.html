<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Time Paradox: Co-op Puzzle</title>
    <style>
        body { margin: 0; overflow: hidden; background: #222; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: white; touch-action: none; }
        canvas { display: block; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: center; align-items: center; background: rgba(0,0,0,0.8); transition: opacity 0.3s; z-index: 10; }
        .menu-box { background: #333; padding: 30px; border-radius: 10px; pointer-events: auto; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h1 { margin-top: 0; color: #4CAF50; }
        input, button { padding: 10px; margin: 10px 0; width: 100%; box-sizing: border-box; border: none; border-radius: 5px; font-size: 16px; }
        button { background: #4CAF50; color: white; cursor: pointer; font-weight: bold; transition: 0.2s; }
        button:hover { background: #45a049; }
        #status { margin-top: 15px; color: #aaa; font-size: 14px; }
        
        /* HUD & Controls */
        #hud { position: absolute; top: 10px; left: 10px; display: none; z-index: 5; text-shadow: 1px 1px 2px black; font-weight: bold; }
        #fullscreen-btn { position: absolute; top: 10px; right: 10px; background: rgba(255,255,255,0.2); border: 2px solid white; color: white; padding: 10px; cursor: pointer; display: none; z-index: 5; pointer-events: auto; border-radius: 5px; }
        
        /* Mobile Controls */
        #mobile-controls { position: absolute; bottom: 20px; left: 20px; width: 150px; height: 150px; display: none; z-index: 5; pointer-events: auto; }
        .d-btn { position: absolute; background: rgba(255,255,255,0.3); border: 1px solid rgba(255,255,255,0.5); border-radius: 50%; width: 50px; height: 50px; font-weight: bold; color: white; display: flex; justify-content: center; align-items: center; user-select: none; }
        .d-btn:active { background: rgba(255,255,255,0.6); }
        #btn-w { top: 0; left: 50px; } #btn-s { bottom: 0; left: 50px; }
        #btn-a { top: 50px; left: 0; } #btn-d { top: 50px; right: 0; }
        #action-btn { position: absolute; bottom: 40px; right: 40px; width: 80px; height: 80px; background: rgba(76, 175, 80, 0.5); border: 2px solid #4CAF50; border-radius: 50%; color: white; font-weight: bold; display: none; z-index: 5; pointer-events: auto; font-size: 12px; }
        #action-btn:active { background: rgba(76, 175, 80, 0.9); }

        @media (max-width: 768px) {
            #mobile-controls, #action-btn, #fullscreen-btn { display: block; }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
</head>
<body>

    <div id="ui-layer">
        <div class="menu-box">
            <h1>Time Paradox</h1>
            <p>Кооперативная головоломка (2 игрока)</p>
            <button id="btn-host" onclick="hostGame()">Создать игру (Прошлое)</button>
            <hr style="border-color: #555;">
            <input type="text" id="join-id" placeholder="Введите ID друга">
            <button id="btn-join" onclick="joinGame()">Подключиться (Будущее)</button>
            <div id="status">Ожидание действий...</div>
        </div>
    </div>

    <div id="hud">Эпоха: <span id="era-text">...</span> | Уровень: <span id="lvl-text">1</span><br><span id="inventory"></span></div>
    <button id="fullscreen-btn" onclick="toggleFullscreen()">На весь экран</button>

    <div id="mobile-controls">
        <div class="d-btn" id="btn-w">W</div>
        <div class="d-btn" id="btn-a">A</div>
        <div class="d-btn" id="btn-s">S</div>
        <div class="d-btn" id="btn-d">D</div>
    </div>
    <button id="action-btn">Действие (E)</button>

    <script>
        // --- ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ И СЕТЬ ---
        let peer = null;
        let connection = null;
        let isHost = false; // Хост = Прошлое, Клиент = Будущее
        let myEra = 'past';

        // --- ДАННЫЕ УРОВНЕЙ ---
        // Легенда: 0=Пустота, 1=Пол, 2=Стена, 3=Семечко(П)/Ключ(Б), 4=Грядка(П), 
        // 5=Дверь(Выход), 6=Кнопка(Б), 7=Дерево(мост в Б), 8=Камень(П), 9=Река, 10=Русло для камня
        const levels = [
            { // УРОВЕНЬ 1: "Посади дерево"
                past: [
                    [2,2,2,2,2,2,2,2],
                    [2,1,1,1,0,1,5,2],
                    [2,1,3,1,4,0,2,2], // 3 - Семечко. 4 - Грядка.
                    [2,1,1,1,0,1,2,2], // Игрок сажает семечко в грядку на (4,2), в Будущем вырастает дерево
                    [2,2,2,2,2,2,2,2]
                ],
                future: [
                    [2,2,2,2,2,2,2,2],
                    [2,1,1,1,0,1,5,2], // 5 - Выход закрыт, пока не нажата кнопка 6
                    [2,1,0,1,0,1,2,2], // Пропасть, нужен мост из дерева
                    [2,1,1,1,0,6,2,2], // 6 - Кнопка, открывающая двери
                    [2,2,2,2,2,2,2,2]
                ],
                start: {x: 1, y: 1}
            },
            { // УРОВЕНЬ 2: "Перекрой реку"
                past: [
                    [2,2,2,2,2,2,2,2],
                    [2,1,1,2,5,1,1,2],
                    [2,1,8,1,9,9,1,2], // 8 - Камень. Игрок толкает его в реку (9) на слот (10)
                    [2,1,1,1,10,9,1,2], 
                    [2,2,2,2,2,2,2,2]
                ],
                future: [
                    [2,2,2,2,2,2,2,2],
                    [2,1,1,2,5,1,1,2], // В будущем река - это наводнение, блокирующее проход.
                    [2,1,2,9,9,9,6,2], // Если перекрыть реку в прошлом, 9 превращается в 1 (суша)
                    [2,1,1,9,9,9,1,2], // Игрок будущего добирается до кнопки (6)
                    [2,2,2,2,2,2,2,2]
                ],
                start: {x: 1, y: 3}
            }
        ];

        let currentLevel = 0;
        let mapData = [];
        let mapObjects = {}; // Хранение 3D мешей сетки
        
        // --- СОСТОЯНИЕ ИГРОКА ---
        let player = { x: 1, y: 1, mesh: null, inventory: null };
        let partner = { x: 1, y: 1, mesh: null };
        let levelState = {
            doorOpen: false,
            treePlanted: false,
            riverBlocked: false
        };

        // --- ДВИЖОК THREE.JS ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x222222);
        document.body.appendChild(renderer.domElement);

        // Освещение (Low Poly стиль)
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        // Материалы (Flat Shading для Low Poly)
        const matFloorPast = new THREE.MeshPhongMaterial({ color: 0x8BC34A, flatShading: true });
        const matFloorFuture = new THREE.MeshPhongMaterial({ color: 0x607D8B, flatShading: true });
        const matWall = new THREE.MeshPhongMaterial({ color: 0x5D4037, flatShading: true });
        const matDirt = new THREE.MeshPhongMaterial({ color: 0x3E2723, flatShading: true });
        const matSeed = new THREE.MeshPhongMaterial({ color: 0xFFC107, flatShading: true });
        const matTree = new THREE.MeshPhongMaterial({ color: 0x4CAF50, flatShading: true });
        const matWood = new THREE.MeshPhongMaterial({ color: 0x795548, flatShading: true });
        const matDoorClosed = new THREE.MeshPhongMaterial({ color: 0xF44336, flatShading: true });
        const matDoorOpen = new THREE.MeshPhongMaterial({ color: 0x4CAF50, flatShading: true });
        const matButton = new THREE.MeshPhongMaterial({ color: 0x00BCD4, flatShading: true });
        const matRiver = new THREE.MeshPhongMaterial({ color: 0x03A9F4, flatShading: true, transparent: true, opacity: 0.8 });
        const matBoulder = new THREE.MeshPhongMaterial({ color: 0x9E9E9E, flatShading: true });

        // Геометрии
        const geoBox = new THREE.BoxGeometry(1, 1, 1);
        const geoFloor = new THREE.BoxGeometry(1, 0.2, 1);
        const geoItem = new THREE.BoxGeometry(0.4, 0.4, 0.4);
        const geoTreeTop = new THREE.ConeGeometry(0.6, 1.5, 5); // Low poly дерево

        function updateStatus(msg) { document.getElementById('status').innerText = msg; }

        // --- ЛОГИКА СЕТИ (Peer.js) ---
        function initPeer() {
            peer = new Peer();
            peer.on('open', id => {
                if (isHost) {
                    updateStatus(`Ваш ID для друга: ${id}\nЖдем подключения...`);
                }
            });
            peer.on('connection', conn => {
                connection = conn;
                setupConnection();
                startGame();
            });
        }

        function hostGame() {
            isHost = true;
            myEra = 'past';
            updateStatus('Создание комнаты...');
            initPeer();
        }

        function joinGame() {
            const id = document.getElementById('join-id').value;
            if (!id) return alert('Введите ID!');
            isHost = false;
            myEra = 'future';
            updateStatus('Подключение...');
            peer = new Peer();
            peer.on('open', () => {
                connection = peer.connect(id);
                setupConnection();
                connection.on('open', startGame);
            });
        }

        function setupConnection() {
            connection.on('data', data => {
                if (data.type === 'move') {
                    partner.x = data.x;
                    partner.y = data.y;
                    updatePlayerPositions();
                }
                if (data.type === 'action') {
                    processNetworkAction(data);
                }
                if (data.type === 'nextLevel') {
                    currentLevel++;
                    buildLevel();
                }
            });
        }

        function sendData(data) {
            if (connection && connection.open) {
                connection.send(data);
            }
        }

        // --- ИГРОВАЯ ЛОГИКА ---
        function startGame() {
            document.getElementById('ui-layer').style.opacity = '0';
            setTimeout(() => document.getElementById('ui-layer').style.display = 'none', 300);
            document.getElementById('hud').style.display = 'block';
            document.getElementById('era-text').innerText = isHost ? "ПРОШЛОЕ" : "БУДУЩЕЕ";
            
            // Создание игроков
            const pGeo = new THREE.BoxGeometry(0.6, 0.6, 0.6);
            player.mesh = new THREE.Mesh(pGeo, new THREE.MeshPhongMaterial({ color: isHost ? 0xFFEB3B : 0x00E5FF }));
            partner.mesh = new THREE.Mesh(pGeo, new THREE.MeshPhongMaterial({ color: isHost ? 0x00E5FF : 0xFFEB3B, transparent: true, opacity: 0.5 })); // Партнер как призрак
            scene.add(player.mesh);
            scene.add(partner.mesh);

            buildLevel();
            animate();
        }

        function buildLevel() {
            // Очистка сцены
            for (let key in mapObjects) { scene.remove(mapObjects[key]); }
            mapObjects = {};
            
            const layout = isHost ? levels[currentLevel].past : levels[currentLevel].future;
            mapData = JSON.parse(JSON.stringify(layout)); // Глубокая копия
            
            player.x = levels[currentLevel].start.x;
            player.y = levels[currentLevel].start.y;
            player.inventory = null;
            partner.x = player.x;
            partner.y = player.y;

            levelState = { doorOpen: false, treePlanted: false, riverBlocked: false };
            document.getElementById('lvl-text').innerText = currentLevel + 1;
            updateInventoryUI();

            for (let z = 0; z < mapData.length; z++) {
                for (let x = 0; x < mapData[z].length; x++) {
                    renderCell(x, z, mapData[z][x]);
                }
            }
            
            // Камера сверху под углом
            camera.position.set(mapData[0].length / 2, 7, mapData.length + 3);
            camera.lookAt(mapData[0].length / 2, 0, mapData.length / 2);
            
            updatePlayerPositions();
        }

        function renderCell(x, z, type) {
            let mesh;
            const key = `${x},${z}`;
            if (mapObjects[key]) { scene.remove(mapObjects[key]); }

            // Базовый пол
            if (type !== 0 && type !== 2 && type !== 9) {
                let floor = new THREE.Mesh(geoFloor, isHost ? matFloorPast : matFloorFuture);
                floor.position.set(x, -0.1, z);
                scene.add(floor);
                mapObjects[key + '_floor'] = floor;
            }

            switch(type) {
                case 2: // Стена
                    mesh = new THREE.Mesh(geoBox, matWall);
                    mesh.position.set(x, 0.5, z);
                    break;
                case 3: // Семечко
                    mesh = new THREE.Mesh(geoItem, matSeed);
                    mesh.position.set(x, 0.2, z);
                    break;
                case 4: // Грядка
                    mesh = new THREE.Mesh(geoFloor, matDirt);
                    mesh.position.set(x, 0, z);
                    break;
                case 5: // Дверь
                    mesh = new THREE.Mesh(geoBox, levelState.doorOpen ? matDoorOpen : matDoorClosed);
                    mesh.position.set(x, 0.5, z);
                    if(levelState.doorOpen) mesh.scale.y = 0.1; // Открытая дверь уходит в пол
                    break;
                case 6: // Кнопка
                    mesh = new THREE.Mesh(geoItem, matButton);
                    mesh.position.set(x, 0, z);
                    break;
                case 7: // Дерево (мост)
                    mesh = new THREE.Group();
                    let trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 1), matWood);
                    trunk.position.y = 0.5;
                    let leaves = new THREE.Mesh(geoTreeTop, matTree);
                    leaves.position.y = 1.2;
                    mesh.add(trunk); mesh.add(leaves);
                    mesh.position.set(x, 0, z);
                    // Мост добавляет коллайдер пола
                    let bridgeFloor = new THREE.Mesh(geoFloor, matWood);
                    bridgeFloor.position.set(x, -0.1, z);
                    scene.add(bridgeFloor);
                    mapObjects[key + '_floor'] = bridgeFloor;
                    break;
                case 8: // Камень
                    mesh = new THREE.Mesh(geoBox, matBoulder);
                    mesh.position.set(x, 0.5, z);
                    break;
                case 9: // Река
                    mesh = new THREE.Mesh(geoFloor, matRiver);
                    mesh.position.set(x, -0.2, z);
                    break;
                case 10: // Русло (цель)
                    mesh = new THREE.Mesh(geoFloor, matDirt);
                    mesh.position.set(x, -0.1, z);
                    break;
            }

            if (mesh) {
                scene.add(mesh);
                mapObjects[key] = mesh;
            }
        }

        // --- УПРАВЛЕНИЕ И ВЗАИМОДЕЙСТВИЕ ---
        window.addEventListener('keydown', (e) => {
            if(document.getElementById('ui-layer').style.display !== 'none') return;
            if(e.key === 'w' || e.key === 'W' || e.key === 'ArrowUp') movePlayer(0, -1);
            if(e.key === 's' || e.key === 'S' || e.key === 'ArrowDown') movePlayer(0, 1);
            if(e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') movePlayer(-1, 0);
            if(e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') movePlayer(1, 0);
            if(e.key === 'e' || e.key === 'E' || e.key === ' ') tryAction();
        });

        // Сенсорное управление
        const setupMobileBtn = (id, dx, dy) => {
            const btn = document.getElementById(id);
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); movePlayer(dx, dy); });
        };
        setupMobileBtn('btn-w', 0, -1); setupMobileBtn('btn-s', 0, 1);
        setupMobileBtn('btn-a', -1, 0); setupMobileBtn('btn-d', 1, 0);
        document.getElementById('action-btn').addEventListener('touchstart', (e) => { e.preventDefault(); tryAction(); });
        document.getElementById('action-btn').addEventListener('click', tryAction); // на случай мыши

        function movePlayer(dx, dy) {
            const nx = player.x + dx;
            const nz = player.y + dy;
            
            // Проверка коллизий
            if (nz >= 0 && nz < mapData.length && nx >= 0 && nx < mapData[0].length) {
                const targetCell = mapData[nz][nx];
                
                // Физика толкания камня
                if (targetCell === 8 && isHost) {
                    const nnx = nx + dx;
                    const nnz = nz + dy;
                    if (nnz >= 0 && nnz < mapData.length && nnx >= 0 && nnx < mapData[0].length) {
                        const cellBehind = mapData[nnz][nnx];
                        if (cellBehind === 1 || cellBehind === 10 || cellBehind === 9) {
                            // Двигаем камень
                            mapData[nz][nx] = 1; // старое место теперь пол
                            if (cellBehind === 10 || cellBehind === 9) {
                                mapData[nnz][nnx] = 1; // Камень упал в реку, стала суша
                                sendData({ type: 'action', action: 'riverBlocked' });
                                processLocalAction('riverBlocked');
                            } else {
                                mapData[nnz][nnx] = 8; 
                            }
                            renderCell(nx, nz, mapData[nz][nx]);
                            renderCell(nnx, nnz, mapData[nnz][nnx]);
                        } else return; // Нельзя толкать
                    } else return;
                }
                else if (targetCell === 0 || targetCell === 2 || targetCell === 9) {
                    return; // Блок
                } else if (targetCell === 5 && !levelState.doorOpen) {
                    return; // Закрытая дверь
                }

                player.x = nx;
                player.y = nz;
                updatePlayerPositions();
                sendData({ type: 'move', x: player.x, y: player.y });

                // Проверка выхода
                if (targetCell === 5 && levelState.doorOpen) {
                    checkLevelComplete();
                }
            }
        }

        function tryAction() {
            const currentCell = mapData[player.y][player.x];
            
            // Взять предмет (Прошлое)
            if (currentCell === 3 && isHost) {
                player.inventory = 'seed';
                mapData[player.y][player.x] = 1; // Убираем с карты
                renderCell(player.x, player.y, 1);
                updateInventoryUI();
            }
            
            // Посадить семечко (Прошлое)
            if (currentCell === 4 && isHost && player.inventory === 'seed') {
                player.inventory = null;
                mapData[player.y][player.x] = 1; // Грядка засыпана
                renderCell(player.x, player.y, 1);
                updateInventoryUI();
                sendData({ type: 'action', action: 'plantTree', x: player.x, y: player.y });
                // В прошлом дерево не нужно, оно вырастает в будущем.
            }

            // Нажать кнопку (Будущее)
            if (currentCell === 6 && !isHost) {
                sendData({ type: 'action', action: 'pressButton' });
                processLocalAction('pressButton');
            }
        }

        function processNetworkAction(data) {
            if (data.action === 'plantTree' && !isHost) {
                // В будущем вырастает дерево (мост)
                mapData[data.y][data.x] = 7; 
                renderCell(data.x, data.y, 7);
                levelState.treePlanted = true;
            }
            if (data.action === 'pressButton' && isHost) {
                processLocalAction('pressButton');
            }
            if (data.action === 'riverBlocked' && !isHost) {
                processLocalAction('riverBlocked');
            }
        }

        function processLocalAction(action) {
            if (action === 'pressButton') {
                levelState.doorOpen = true;
                // Находим и открываем двери
                for(let z=0; z<mapData.length; z++) {
                    for(let x=0; x<mapData[z].length; x++) {
                        if (mapData[z][x] === 5) renderCell(x, z, 5);
                    }
                }
            }
            if (action === 'riverBlocked') {
                levelState.riverBlocked = true;
                // Иссушаем реку в Будущем
                for(let z=0; z<mapData.length; z++) {
                    for(let x=0; x<mapData[z].length; x++) {
                        if (mapData[z][x] === 9) {
                            mapData[z][x] = 1;
                            renderCell(x, z, 1);
                        }
                    }
                }
            }
        }

        function checkLevelComplete() {
            // Если оба игрока на клетке выхода
            if (partner.x === player.x && partner.y === player.y) {
                if (currentLevel < levels.length - 1) {
                    if (isHost) {
                        currentLevel++;
                        sendData({ type: 'nextLevel' });
                        buildLevel();
                    }
                } else {
                    alert("ПОБЕДА! Временной парадокс разрешен.");
                }
            }
        }

        function updatePlayerPositions() {
            // Плавная интерполяция была бы лучше, но для простоты прыжки
            if(player.mesh) {
                player.mesh.position.set(player.x, 0.3, player.y);
            }
            if(partner.mesh) {
                partner.mesh.position.set(partner.x, 0.3, partner.y);
            }
        }

        function updateInventoryUI() {
            document.getElementById('inventory').innerText = player.inventory ? `В руках: ${player.inventory === 'seed' ? 'Семечко' : player.inventory}` : '';
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log(`Error attempting to enable fullscreen: ${err.message}`);
                });
            } else {
                document.exitFullscreen();
            }
        }

        // --- ГЛАВНЫЙ ЦИКЛ РЕНДЕРИНГА ---
        function animate() {
            requestAnimationFrame(animate);
            // Небольшая анимация дыхания игрока
            if(player.mesh) {
                player.mesh.position.y = 0.3 + Math.sin(Date.now() * 0.005) * 0.05;
            }
            renderer.render(scene, camera);
        }

        // Адаптация под размер окна
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

    </script>
</body>
</html>
