<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messenger</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--text:#c9d1d9;--accent:#58a6ff;--border:#30363d;--user:#1f6feb;--peer:#21262d}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);display:flex;justify-content:center;padding:12px;min-height:100vh}
.app{width:100%;max-width:420px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px}
h2{font-size:16px;margin-bottom:12px;color:#fff}
button{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:10px 16px;font-size:14px;cursor:pointer;width:100%}
button:disabled{opacity:.4}
button.secondary{background:transparent;border:1px solid var(--border);color:var(--text)}
input,textarea{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px;color:var(--text);font-size:14px;outline:none;resize:none}
.hidden{display:none}
#qr-container{display:flex;justify-content:center;margin:12px 0}
#qr-container img,#qr-container canvas{border-radius:8px}
.contact-info{font-size:11px;color:#8b949e;word-break:break-all;margin-top:8px}
#chat-messages{display:flex;flex-direction:column;gap:8px;max-height:360px;overflow-y:auto;padding:4px 0}
.message{max-width:85%;padding:8px 12px;border-radius:16px;font-size:14px;line-height:1.4;word-break:break-word}
.message.sent{align-self:flex-end;background:var(--user);border-bottom-right-radius:4px}
.message.received{align-self:flex-start;background:var(--peer);border-bottom-left-radius:4px}
.message .meta{font-size:10px;opacity:.7;margin-top:4px}
.status{font-size:12px;padding:6px 10px;border-radius:8px;text-align:center;margin-top:8px}
.status.ok{background:#1a3a1a;color:#7ee787}
.status.err{background:#3d1f1f;color:#f85149}
.status.info{background:#1f2a3d;color:#79c0ff}
.flex-row{display:flex;gap:8px}
.flex-row button{flex:1}
#scanner-container{margin-top:12px}
</style>
</head>
<body>
<div class="app">

<div id="step-init" class="card">
  <h2>🔑 Ваш контакт</h2>
  <p style="font-size:13px;color:#8b949e;margin-bottom:12px">Покажите этот QR-код собеседнику.</p>
  <div id="qr-container"></div>
  <div id="my-id-display" class="contact-info"></div>
  <button id="btn-copy-id" class="secondary" style="margin-top:8px">📋 Скопировать мой контакт</button>
</div>

<div id="step-add" class="card">
  <h2>📇 Добавить контакт</h2>
  <p style="font-size:13px;color:#8b949e;margin-bottom:12px">Отсканируйте QR или вставьте вручную.</p>
  <div class="flex-row" style="margin-bottom:8px">
    <button id="btn-scan">📷 Сканировать</button>
    <button id="btn-paste" class="secondary">📋 Вставить</button>
  </div>
  <textarea id="paste-area" rows="3" placeholder="Контакт собеседника..."></textarea>
  <button id="btn-add-contact" style="margin-top:8px">✅ Добавить</button>
  <div id="add-status" class="status hidden"></div>
  <div id="scanner-container" class="hidden">
    <video id="scanner-video" style="width:100%;border-radius:8px" playsinline></video>
    <button id="btn-stop-scan" class="secondary" style="margin-top:8px">Остановить</button>
  </div>
</div>

<div id="step-chat" class="card hidden">
  <h2>💬 Чат с <span id="peer-name">...</span></h2>
  <div id="chat-messages"></div>
  <div style="display:flex;gap:8px;margin-top:12px">
    <input id="msg-input" type="text" placeholder="Сообщение..." />
    <button id="btn-send" style="width:auto;padding:10px 20px">➤</button>
  </div>
  <div id="chat-status" class="status hidden"></div>
  <button id="btn-reset" class="secondary" style="margin-top:12px">🔄 Сбросить</button>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
/* ============================================================
   Messenger на ntfy.sh  (транспорт) + ECDH/AES-GCM (шифрование)
   ============================================================ */

const NTFY_HTTP = 'https://ntfy.sh';
const NTFY_WS   = 'wss://ntfy.sh';
const TOPIC_PREFIX = 'wmsgr_'; // чтобы не пересекаться с чужими топиками

const state = {
  myUID: null,
  myKeyPair: null,
  myPublicKeyB64: null,
  contact: null,
  ws: null,
  wsReconnectTimer: null
};

// ---------- утилиты ----------
const uid = () => 'u' + Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
const bufToB64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const b64ToBuf = b64 => { const s = atob(b64); const a = new Uint8Array(s.length); for (let i=0;i<s.length;i++) a[i]=s.charCodeAt(i); return a.buffer; };
const strToBuf = s => new TextEncoder().encode(s).buffer;
const bufToStr = b => new TextDecoder().decode(b);

function showStatus(id, text, type='info') {
  const el = document.getElementById(id);
  el.textContent = text;
  el.className = 'status ' + type;
  el.classList.remove('hidden');
  if (type === 'ok') setTimeout(() => el.classList.add('hidden'), 4000);
}

// ---------- крипто ----------
async function generateKeyPair() {
  const kp = await crypto.subtle.generateKey({name:'ECDH',namedCurve:'P-256'}, true, ['deriveBits']);
  const spki = await crypto.subtle.exportKey('spki', kp.publicKey);
  return { keyPair: kp, publicKeyB64: bufToB64(spki) };
}
async function importPub(b64) {
  return crypto.subtle.importKey('spki', b64ToBuf(b64),
    {name:'ECDH',namedCurve:'P-256'}, true, []);
}
async function deriveAesKey(myPriv, theirPubB64) {
  const theirPub = await importPub(theirPubB64);
  const bits = await crypto.subtle.deriveBits({name:'ECDH', public: theirPub}, myPriv, 256);
  return crypto.subtle.importKey('raw', bits, {name:'AES-GCM'}, false, ['encrypt','decrypt']);
}
async function encryptMessage(plain, myPriv, theirPubB64) {
  const key = await deriveAesKey(myPriv, theirPubB64);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, strToBuf(plain));
  return { iv: bufToB64(iv.buffer), ct: bufToB64(ct) };
}
async function decryptMessage(ivB64, ctB64, myPriv, theirPubB64) {
  const key = await deriveAesKey(myPriv, theirPubB64);
  const iv = new Uint8Array(b64ToBuf(ivB64));
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, b64ToBuf(ctB64));
  return bufToStr(pt);
}

// ---------- ntfy: приём ----------
function myTopic() { return TOPIC_PREFIX + state.myUID; }

function connectWebSocket() {
  if (state.ws) try { state.ws.close(); } catch(_) {}
  const url = `${NTFY_WS}/${myTopic()}/ws`;
  console.log('[WS] connect', url);
  const ws = new WebSocket(url);
  state.ws = ws;

  ws.onopen = () => {
    console.log('[WS] open');
    showStatus('chat-status', 'На связи ✓', 'ok');
  };
  ws.onmessage = async (ev) => {
    let frame;
    try { frame = JSON.parse(ev.data); } catch { return; }
    if (frame.event !== 'message') return;   // open/keepalive — игнор
    await handleIncoming(frame.message);
  };
  ws.onclose = () => {
    console.log('[WS] closed, reconnecting in 3s');
    clearTimeout(state.wsReconnectTimer);
    state.wsReconnectTimer = setTimeout(connectWebSocket, 3000);
  };
  ws.onerror = (e) => console.warn('[WS] error', e);
}

// ---------- ntfy: отправка ----------
async function publish(topic, body) {
  const res = await fetch(`${NTFY_HTTP}/${topic}`, {
    method: 'POST',
    body: body
  });
  if (!res.ok) throw new Error('ntfy вернул ' + res.status);
}

// ---------- обработка входящего ----------
async function handleIncoming(bodyText) {
  if (!state.contact) return;
  let payload;
  try { payload = JSON.parse(bodyText); } catch { return; }

  // защита от эха (ntfy вернёт и наши собственные сообщения, если мы случайно отправим в свой топик)
  if (payload.fromUID === state.myUID) return;

  // если ключ отправителя не совпадает с сохранённым контактом — игнорируем
  if (payload.fromUID !== state.contact.uid) {
    console.warn('Неизвестный отправитель:', payload.fromUID);
    return;
  }

  try {
    const text = await decryptMessage(
      payload.iv, payload.ct,
      state.myKeyPair.privateKey,
      state.contact.publicKey
    );
    addMessageToUI(text, 'received', payload.timestamp || Date.now());
    notify(text);
  } catch (e) {
    console.error('Расшифровка не удалась', e);
    addMessageToUI('[не удалось расшифровать]', 'received');
  }
}

// ---------- всплывающее уведомление браузера ----------
function notify(text) {
  if (!('Notification' in window)) return;
  if (Notification.permission === 'granted') {
    new Notification('💬 Новое сообщение', { body: text.slice(0, 120), tag: 'msg' });
  }
}

// ---------- UI ----------
function addMessageToUI(text, direction, ts = Date.now()) {
  const c = document.getElementById('chat-messages');
  const div = document.createElement('div');
  div.className = 'message ' + direction;
  const time = new Date(ts).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
  const safe = document.createElement('div');
  safe.textContent = text;
  div.appendChild(safe);
  const meta = document.createElement('div');
  meta.className = 'meta';
  meta.textContent = time;
  div.appendChild(meta);
  c.appendChild(div);
  c.scrollTop = c.scrollHeight;
}

async function renderMyQR() {
  const contact = {
    uid: state.myUID,
    publicKey: state.myPublicKeyB64
  };
  document.getElementById('my-id-display').textContent = 'UID: ' + state.myUID;
  const box = document.getElementById('qr-container');
  box.innerHTML = '';
  new QRCode(box, {
    text: JSON.stringify(contact),
    width: 220, height: 220,
    correctLevel: QRCode.CorrectLevel.M
  });
}

function parseContact(str) {
  const o = JSON.parse(str.trim());
  if (!o.uid || !o.publicKey) throw new Error('Не хватает uid или publicKey');
  return o;
}

async function addContact(jsonStr) {
  try {
    const c = parseContact(jsonStr);
    if (c.uid === state.myUID) throw new Error('Это ваш собственный контакт');
    state.contact = c;
    document.getElementById('peer-name').textContent = c.uid;
    document.getElementById('step-init').classList.add('hidden');
    document.getElementById('step-add').classList.add('hidden');
    document.getElementById('step-chat').classList.remove('hidden');
    showStatus('chat-status', 'Контакт добавлен', 'ok');
  } catch (e) {
    showStatus('add-status', 'Ошибка: ' + e.message, 'err');
  }
}

async function sendMessage() {
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if (!text || !state.contact) return;
  try {
    const enc = await encryptMessage(text, state.myKeyPair.privateKey, state.contact.publicKey);
    const payload = {
      fromUID: state.myUID,
      iv: enc.iv,
      ct: enc.ct,
      timestamp: Date.now()
    };
    // отправляем в топик ПОЛУЧАТЕЛЯ
    await publish(TOPIC_PREFIX + state.contact.uid, JSON.stringify(payload));
    addMessageToUI(text, 'sent');
    input.value = '';
  } catch (e) {
    console.error(e);
    showStatus('chat-status', 'Ошибка: ' + e.message, 'err');
  }
}

// ---------- сканер QR ----------
async function startScan() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode:'environment' } });
    state.scanStream = stream;
    const v = document.getElementById('scanner-video');
    v.srcObject = stream;
    await v.play();
    document.getElementById('scanner-container').classList.remove('hidden');
    requestAnimationFrame(scanFrame);
  } catch (e) {
    showStatus('add-status', 'Камера недоступна: ' + e.message, 'err');
  }
}
function scanFrame() {
  const v = document.getElementById('scanner-video');
  if (!v || v.readyState !== v.HAVE_ENOUGH_DATA) return requestAnimationFrame(scanFrame);
  const cv = document.createElement('canvas');
  cv.width = v.videoWidth; cv.height = v.videoHeight;
  const ctx = cv.getContext('2d');
  ctx.drawImage(v, 0, 0);
  const img = ctx.getImageData(0, 0, cv.width, cv.height);
  const code = jsQR(img.data, img.width, img.height);
  if (code) {
    stopScan();
    addContact(code.data);
  } else {
    requestAnimationFrame(scanFrame);
  }
}
function stopScan() {
  if (state.scanStream) { state.scanStream.getTracks().forEach(t=>t.stop()); state.scanStream = null; }
  document.getElementById('scanner-container').classList.add('hidden');
}

// ---------- init ----------
async function init() {
  try {
    // просим разрешение на уведомления
    if ('Notification' in window && Notification.permission === 'default') {
      try { await Notification.requestPermission(); } catch(_) {}
    }

    state.myUID = uid();
    const { keyPair, publicKeyB64 } = await generateKeyPair();
    state.myKeyPair = keyPair;
    state.myPublicKeyB64 = publicKeyB64;

    await renderMyQR();
    connectWebSocket();

    // пробуем восстановить контакт
    const saved = localStorage.getItem('contact');
    if (saved) {
      try { await addContact(saved); } catch(_) {}
    }
  } catch (e) {
    console.error(e);
    alert('Ошибка инициализации: ' + e.message);
  }
}

// ---------- события ----------
document.getElementById('btn-copy-id').onclick = async () => {
  const contact = { uid: state.myUID, publicKey: state.myPublicKeyB64 };
  try {
    await navigator.clipboard.writeText(JSON.stringify(contact));
    showStatus('add-status', 'Контакт скопирован', 'ok');
  } catch (e) { showStatus('add-status', 'Буфер недоступен', 'err'); }
};
document.getElementById('btn-scan').onclick = startScan;
document.getElementById('btn-stop-scan').onclick = stopScan;
document.getElementById('btn-paste').onclick = async () => {
  try { document.getElementById('paste-area').value = await navigator.clipboard.readText(); }
  catch { showStatus('add-status','Нет доступа к буферу','err'); }
};
document.getElementById('btn-add-contact').onclick = async () => {
  const v = document.getElementById('paste-area').value.trim();
  if (!v) return showStatus('add-status','Пусто','err');
  try { parseContact(v); localStorage.setItem('contact', v); } catch(_) {}
  await addContact(v);
};
document.getElementById('btn-send').onclick = sendMessage;
document.getElementById('msg-input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
document.getElementById('btn-reset').onclick = () => { localStorage.clear(); location.reload(); };

window.addEventListener('load', init);
</script>
</body>
</html>
